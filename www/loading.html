<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/protect.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading - APNAJ</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #1e90ff;
    --bg: #07080c;
    --surface: #0d0f16;
    --border: rgba(255, 255, 255, 0.07);
    --text: #f0f2ff;
    --muted: rgba(240, 242, 255, 0.45);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
  }

  body {
    background: url('https://i.supaimg.com/9d6e18f4-1d1c-4ad2-be6e-032e508dd07f.png') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Dark Glass Overlay to match index.html */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(7, 8, 12, 0.65);
    z-index: 0;
  }

  .loader-container {
    position: relative;
    z-index: 1;
    background: rgba(13, 15, 22, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    padding: 50px 60px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    animation: fadeUp 0.6s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(255, 255, 255, 0.05);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    margin: 0 auto 24px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .text {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--text);
    font-size: 28px;
    letter-spacing: 4px;
  }
  
  .subtext {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>

<body>
  <div class="loader-container">
    <div class="loader"></div>
    <div class="text">APNAJ</div>
    <div class="subtext">Authenticating...</div>
  </div>

<script>
  // Redirect after loading
  setTimeout(() => {
    window.location.href = "login.html";
  }, 3000); // 3 seconds
</script>
</body>
</html>
