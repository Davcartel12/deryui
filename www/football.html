<!DOCTYPE html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="UTF-8">
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>Football - CHIKE1W</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      --bg: #090d16;
      --header: #0c1220;
      --line: rgba(255, 255, 255, 0.08);
      --green: #00a84f;
      --gold: #f0b429;
      --text: #ffffff;
      --muted: #8d97ab;
      --red: #e03030;
      --panel: #151b2b;
      --ink: #ffffff;
      --ink-2: #c5cddd;
      --ink-3: #8d97ab;
      --pitch: #00a84f;
      --pitch-deep: #00a84f;
      --pending: #f0b429;
      --paper: #ffffff;
    }

    html { -webkit-text-size-adjust: 100%; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      min-height: 100svh;
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    }

    img { -webkit-user-drag: none; user-select: none; }

    .wrap {
      width: calc(100% - 24px);
      max-width: 430px;
      margin: 0 auto;
      padding: 12px 0 8px;
    }

    .navbar { display: none !important; }

    .hero-board {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 12px 12px;
      margin-bottom: 10px;
    }

    .hero-eyebrow {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero-match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hero-team { flex: 1; min-width: 0; text-align: center; }
    .hero-team.away { text-align: center; }

    .hero-crest {
      width: 42px;
      height: 42px;
      margin: 0 auto 6px;
      border-radius: 10px;
      background: #1b2234;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-crest img { width: 100%; height: 100%; object-fit: contain; }

    .hero-tname {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-center { flex: 0 0 88px; text-align: center; }
    .hero-vs { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
    .hero-time { margin-top: 4px; font-size: 18px; font-weight: 800; }
    .hero-date { margin-top: 2px; font-size: 11px; color: var(--muted); }

    .control-bar { margin: 0 0 10px; }
    .control-inner { display: flex; gap: 8px; align-items: center; }
    .coupon-bar-label { display: none; }

    .build-coupon-btn {
      flex: 1;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      padding: 13px;
    }

    .coupon-count-badge {
      background: #1b2234;
      border: 1px solid var(--line);
      color: #fff;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .coupon-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }

    .coupon-overlay.open { display: flex; }

    .coupon-sheet {
      width: 100%;
      max-width: 430px;
      max-height: 82svh;
      overflow: auto;
      background: #121826;
      border-radius: 18px 18px 0 0;
      padding: 16px;
    }

    .coupon-sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .coupon-sheet-title { font-size: 16px; font-weight: 800; }
    .coupon-close-btn {
      border: 0;
      background: #1b2234;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
    }

    .coupon-stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .coupon-stat { background: #1b2234; border-radius: 10px; padding: 10px; text-align: center; }
    .coupon-stat-val { font-size: 18px; font-weight: 800; }
    .coupon-stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .coupon-accuracy-bar-wrap { height: 6px; background: #1b2234; border-radius: 99px; overflow: hidden; }
    .coupon-accuracy-bar { height: 100%; background: var(--green); width: 0; transition: width .4s; }
    .coupon-accuracy-label { font-size: 11px; color: var(--muted); margin: 6px 0 12px; }
    .coupon-section-title { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
    .coupon-pick-row { display: flex; gap: 8px; align-items: center; background: #1b2234; border-radius: 10px; padding: 10px; margin-bottom: 6px; }
    .coupon-pick-row.top-pick { border: 1px solid var(--gold); }
    .coupon-pick-num { width: 22px; height: 22px; border-radius: 50%; background: #0c1220; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
    .coupon-pick-info { flex: 1; min-width: 0; }
    .coupon-pick-match { font-size: 12px; font-weight: 700; }
    .coupon-pick-market { font-size: 11px; color: var(--muted); }
    .coupon-pick-market span { color: var(--gold); }
    .coupon-pick-conf { font-size: 12px; font-weight: 800; color: var(--green); }
    .coupon-disclaimer, .coupon-no-data { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 10px; }

    #error-banner {
      display: none;
      background: rgba(224, 48, 48, 0.15);
      border: 1px solid rgba(224, 48, 48, 0.4);
      color: #ff8a8a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .day-tabs-wrap {
      display: none;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .day-tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #1b2234;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .day-tab.active { background: var(--green); color: #fff; border-color: var(--green); }
    .day-count { display: block; font-size: 10px; font-weight: 600; opacity: 0.8; }

    #loader { display: none; justify-content: center; padding: 28px; }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #1b2234; border-top-color: var(--green);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #empty-state { display: none; text-align: center; padding: 28px 10px; color: var(--muted); }
    #empty-state h3 { color: #fff; margin-bottom: 6px; }
    .e-icon { display: none; }

    .time-group { margin-bottom: 12px; }
    .time-col { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 6px; }

    .match-row {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .match-comp { font-size: 10px; color: var(--muted); font-weight: 700; }
    .status-badge { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; }
    .s-live { color: #ff5b6e; }
    .s-done { color: var(--muted); }
    .s-sched { color: var(--green); }

    .teams-stack { display: flex; flex-direction: column; gap: 8px; }
    .team-row { display: flex; align-items: center; gap: 8px; }
    .tcrest { width: 24px; height: 24px; border-radius: 6px; overflow: hidden; background: #1b2234; flex-shrink: 0; }
    .tcrest img { width: 100%; height: 100%; object-fit: contain; }
    .tname { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; }
    .tname.winner { color: var(--gold); }
    .tscore { width: 22px; text-align: right; font-weight: 800; }
    .winner-score { color: var(--gold); }

    .pred-row { margin-top: 10px; }
    .pred-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1b2234;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .pred-pill.hit { border: 1px solid var(--green); }
    .pred-pill.miss { border: 1px solid var(--red); }
    .pred-icon { display: none; }
    .pred-label { flex: 1; font-size: 13px; font-weight: 800; }
    .pred-value { text-align: right; }
    .pv-conf { font-size: 13px; font-weight: 800; color: var(--green); }
    .pv-odds { font-size: 10px; color: var(--muted); }
    .pred-conf { font-size: 10px; font-weight: 800; color: var(--gold); }

    .match-expand { display: none; }
    .match-expand.open { display: block; }
    .expand-inner { padding: 10px 2px 2px; }

    .prob-label-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .prob-bar-row { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: #1b2234; }
    .pb-h { background: var(--green); }
    .pb-d { background: #5b6478; }
    .pb-a { background: #3a7bd5; }

    .markets-section-label { margin: 12px 0 6px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
    .markets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .market-row {
      background: #1b2234;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .market-row.market-best { border: 1px solid var(--green); }
    .market-label { color: var(--muted); }
    .market-pick { color: var(--green); font-weight: 800; }

    .xg-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 11px; }
    .xg-tag { background: #1b2234; border-radius: 6px; padding: 4px 6px; font-weight: 700; }
    .analysis-txt { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.45; }

    .winner-banner {
      background: linear-gradient(135deg, rgba(0, 168, 79, 0.18), rgba(58, 123, 213, 0.12));
      border: 1px solid rgba(0, 168, 79, 0.35);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .winner-banner .wb-kicker { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; color: var(--muted); text-transform: uppercase; }
    .winner-banner .wb-name { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .winner-banner .wb-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .advice-box {
      background: #1b2234;
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      font-size: 12px;
    }
    .advice-box strong { color: var(--green); }
    .factor-block { margin-top: 12px; }
    .factor-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .factor-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
    .factor-side .fp { font-size: 18px; font-weight: 800; line-height: 1; }
    .factor-side .fl { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .factor-side.right { text-align: right; }
    .factor-mid { font-size: 10px; font-weight: 800; color: var(--muted); padding-bottom: 14px; }
    .factor-bar {
      margin-top: 8px;
      height: 7px;
      border-radius: 99px;
      overflow: hidden;
      background: #1b2234;
      display: flex;
    }
    .factor-bar .fh { background: var(--green); }
    .factor-bar .fa { background: #3a7bd5; }
    .factor-note { margin-top: 6px; font-size: 10px; color: var(--muted); }

    .widget-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
    .widget-head h3 { font-size: 14px; }
    .league-select {
      background: #1b2234;
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-family: inherit;
    }

    .scorer-row, .standings-tbl { width: 100%; }
    .scorer-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .scorer-pos { width: 18px; font-size: 12px; font-weight: 800; color: var(--muted); }
    .scorer-info { flex: 1; min-width: 0; }
    .scorer-name { font-size: 13px; font-weight: 700; }
    .scorer-club { font-size: 11px; color: var(--muted); }
    .scorer-g { font-size: 13px; font-weight: 800; }

    .standings-tbl { border-collapse: collapse; font-size: 12px; }
    .standings-tbl th, .standings-tbl td { padding: 7px 4px; text-align: left; }
    .standings-tbl th { color: var(--muted); font-size: 10px; }
    .pos-cl { color: var(--green); font-weight: 800; }
    .pos-rel { color: var(--red); font-weight: 800; }
    .pts { font-weight: 800; }

    .sidebar { display: none; }
    .mobile-panel.hidden { display: none; }
    .mobile-panel { margin-top: 8px; }

    .mobile-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 250;
      display: flex;
      background: #0c1220;
      border-top: 1px solid var(--line);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    }

    .mnav-btn {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
    }
    .mnav-btn.active { color: #fff; }
    .micon { display: none; }
  </style>
</head>

<script>
    /* -- CONFIG -- */
    const PROXY_BASES = [
      'https://trd.cc.nf/football.php',
      '/.netlify/functions/football'
    ];
    // Leagues shown on the card (free football-data.org tier).
    const ALL_COMPS = ['PL', 'PD', 'BL1', 'SA', 'FL1'];
    const ALL_COMP_SET = new Set(ALL_COMPS);
    // Throttle: free tier = 10 requests/min.
    const REQ_GAP_MS = 6500;
    let allMatches = [];
    let currentDay = null;
    let teamForm = {};
    let teamStats = {};
    let leaguePositions = {};
    let dayGroups = {};
    let matchPredictions = {};
    const memCache = {};

    /* -- THROTTLE HELPERS -- */
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    // Run async task-producing fns one at a time with a gap between them.
    async function runSequential(fns, gap = REQ_GAP_MS) {
      const out = [];
      for (let i = 0; i < fns.length; i++) {
        try { out.push({ status: 'fulfilled', value: await fns[i]() }); }
        catch (e) { out.push({ status: 'rejected', reason: e }); }
        if (i < fns.length - 1) await sleep(gap);
      }
      return out;
    }

    /* -- HELPERS -- */
    function fmtDate(d) { return d.toISOString().split('T')[0]; }
    function todayStr() { return fmtDate(new Date()); }
    // football-data.org treats dateTo as exclusive, so +3 covers through today+2.
    function weekEnd() { const d = new Date(); d.setDate(d.getDate() + 3); return fmtDate(d); }
    function rangeStart() { const d = new Date(); d.setDate(d.getDate() - 2); return fmtDate(d); }
    function dayKeyForOffset(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }).toUpperCase(); }
    function matchDayKey(utcDate) { const d = new Date(utcDate); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }).toUpperCase(); }
    function matchTimeStr(utcDate) { if (!utcDate) return '–'; const d = new Date(utcDate); return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
    function sortKey(utcDate) { return new Date(utcDate).getTime(); }

    /* -- PREDICTION ENGINE -- */
    function poisson(lambda, k) { if (lambda <= 0) return k === 0 ? 1 : 0; let p = Math.exp(-lambda); for (let i = 1; i <= k; i++)p *= lambda / i; return p; }
    function probExactGoals(lambdaH, lambdaA, n) { let p = 0; for (let h = 0; h <= n; h++)p += poisson(lambdaH, h) * poisson(lambdaA, n - h); return p; }
    function probUnder(lambdaH, lambdaA, threshold) { let p = 0; for (let n = 0; n <= threshold; n++)p += probExactGoals(lambdaH, lambdaA, n); return Math.min(1, p); }
    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
    function pairPct(a, b) {
      const aa = Math.max(0.01, a), bb = Math.max(0.01, b), t = aa + bb;
      const home = Math.round((aa / t) * 100);
      return { home, away: 100 - home };
    }
    // TejTips-style contrast: small rating gaps become clear % splits (e.g. 6/94 form).
    function softExtreme(a, b, temp = 14) {
      const home = clamp(Math.round(100 / (1 + Math.exp(-(a - b) / temp))), 3, 97);
      return { home, away: 100 - home };
    }
    function venueAvg(s, side, key) {
      // side: 'home' | 'away' — per-venue averages when we have enough sample
      if (side === 'home' && s.homeN >= 3) return key === 'gf' ? s.homeGf / s.homeN : s.homeGa / s.homeN;
      if (side === 'away' && s.awayN >= 3) return key === 'gf' ? s.awayGf / s.awayN : s.awayGa / s.awayN;
      return key === 'gf' ? (parseFloat(s.avgGf) || 1.25) : (parseFloat(s.avgGa) || 1.25);
    }
    function formScore(results) {
      const recent = (results || []).slice(-8);
      if (!recent.length) return 50;
      let pts = 0;
      recent.forEach((r, i) => {
        const w = 0.55 + (i / Math.max(1, recent.length - 1)) * 0.45; // newer games weigh more
        if (r === 'W') pts += 3 * w;
        else if (r === 'D') pts += 1 * w;
      });
      const max = recent.reduce((s, _, i) => s + 3 * (0.55 + (i / Math.max(1, recent.length - 1)) * 0.45), 0);
      return clamp((pts / max) * 100, 5, 97);
    }
    function tableStrength(teamId) {
      const pos = leaguePositions[teamId];
      if (!pos) return 50;
      // rank 1 ≈ 92, rank 20 ≈ 12
      return clamp(100 - (pos - 1) * 4.2, 8, 95);
    }

    function computePrediction(match) {
      if (matchPredictions[match.id]) return matchPredictions[match.id];

      const home = match.homeTeam || {}; const away = match.awayTeam || {};
      const sH = teamStats[home.id] || { avgGf: 1.25, avgGa: 1.25, winRate: 33, results: [], h2h: {}, gf: 0, ga: 0, w: 0, d: 0, l: 0 };
      const sA = teamStats[away.id] || { avgGf: 1.25, avgGa: 1.25, winRate: 33, results: [], h2h: {}, gf: 0, ga: 0, w: 0, d: 0, l: 0 };
      const hasSample = ((sH.results || []).length >= 3) && ((sA.results || []).length >= 3);

      // League-table prior softens empty-stat matches
      const tblH = tableStrength(home.id);
      const tblA = tableStrength(away.id);

      // --- Factor scores (TejTips stack: form / attack / defense / goals / Poisson / H2H) ---
      const formRawH = formScore(sH.results);
      const formRawA = formScore(sA.results);
      const formBlendH = hasSample ? formRawH * 0.85 + tblH * 0.15 : tblH * 0.7 + 50 * 0.3;
      const formBlendA = hasSample ? formRawA * 0.85 + tblA * 0.15 : tblA * 0.7 + 50 * 0.3;
      const form = softExtreme(formBlendH + 3, formBlendA, 11);

      // Venue splits like TejTips season HOME/AWAY blocks
      const homeAtk = venueAvg(sH, 'home', 'gf');
      const homeDefGa = venueAvg(sH, 'home', 'ga');
      const awayAtk = venueAvg(sA, 'away', 'gf');
      const awayDefGa = venueAvg(sA, 'away', 'ga');
      const atkH = parseFloat(sH.avgGf) || homeAtk;
      const atkA = parseFloat(sA.avgGf) || awayAtk;
      const attack = softExtreme(homeAtk * 40 + tblH * 0.25, awayAtk * 40 + tblA * 0.25, 12);

      const defH = 1 / Math.max(0.35, homeDefGa);
      const defA = 1 / Math.max(0.35, awayDefGa);
      const defense = softExtreme(defH * 55 + tblH * 0.2, defA * 55 + tblA * 0.2, 12);

      // Expected goals: home attack vs away defense (and reverse) + home advantage
      const HOME_ADV = 0.25;
      const expH = Math.max(0.15, (homeAtk + awayDefGa) / 2 + HOME_ADV + (tblH - tblA) * 0.005);
      const expA = Math.max(0.12, (awayAtk + homeDefGa) / 2 + Math.max(0, (tblA - tblH) * 0.0035));
      const goals = softExtreme(expH * 50, expA * 50, 10);

      // Poisson 1X2 (full time)
      let pHomeWin = 0, pDraw = 0, pAwayWin = 0;
      for (let h = 0; h <= 8; h++) {
        for (let a = 0; a <= 8; a++) {
          const prob = poisson(expH, h) * poisson(expA, a);
          if (h > a) pHomeWin += prob;
          else if (h === a) pDraw += prob;
          else pAwayWin += prob;
        }
      }
      const pSum = pHomeWin + pDraw + pAwayWin || 1;
      pHomeWin /= pSum; pDraw /= pSum; pAwayWin /= pSum;
      const poissonPair = softExtreme(pHomeWin * 100, pAwayWin * 100, 9);

      // Half-time lean (~45% of goals fall in 1st half — TejTips Half-Time market)
      const htH = expH * 0.45, htA = expA * 0.45;
      let pHt1 = 0, pHtX = 0, pHt2 = 0;
      for (let h = 0; h <= 5; h++) {
        for (let a = 0; a <= 5; a++) {
          const prob = poisson(htH, h) * poisson(htA, a);
          if (h > a) pHt1 += prob;
          else if (h === a) pHtX += prob;
          else pHt2 += prob;
        }
      }
      const htSum = pHt1 + pHtX + pHt2 || 1;
      pHt1 /= htSum; pHtX /= htSum; pHt2 /= htSum;

      // H2H
      const meetings = (sH.h2h && sH.h2h[away.id]) ? sH.h2h[away.id] : [];
      let h2hHomeWins = 0, h2hAwayWins = 0, h2hDraws = 0;
      meetings.forEach(g => {
        if (!g.winner) h2hDraws++;
        else if (g.winner === home.id) h2hHomeWins++;
        else if (g.winner === away.id) h2hAwayWins++;
      });
      const h2h = meetings.length
        ? softExtreme(h2hHomeWins * 3 + h2hDraws + 0.4, h2hAwayWins * 3 + h2hDraws + 0.4, 8)
        : softExtreme(tblH + 2, tblA, 13);

      // Overall blend — same six layers TejTips AI Insights uses
      const overallH = (
        form.home * 0.18 +
        attack.home * 0.14 +
        defense.home * 0.14 +
        goals.home * 0.12 +
        poissonPair.home * 0.27 +
        h2h.home * 0.15
      );
      const overall = { home: Math.round(overallH), away: Math.round(100 - overallH) };
      const edge = overall.home - overall.away;

      // Adjust 1X2 with overall edge
      const adj = clamp(edge / 100 * 0.28, -0.22, 0.22);
      let aHome = clamp(pHomeWin + adj, 0.04, 0.90);
      let aAway = clamp(pAwayWin - adj, 0.04, 0.90);
      let aDraw = clamp(pDraw - Math.abs(adj) * 0.4, 0.05, 0.40);
      if (Math.abs(edge) < 8) aDraw = clamp(aDraw + 0.05, 0.08, 0.38);
      const aSum = aHome + aDraw + aAway;
      aHome /= aSum; aDraw /= aSum; aAway /= aSum;

      const homeW = Math.round(aHome * 100);
      const drawP = Math.round(aDraw * 100);
      const awayW = Math.max(0, 100 - homeW - drawP);

      const pOver05 = 1 - probExactGoals(expH, expA, 0);
      const pUnder15 = probUnder(expH, expA, 1); const pOver15 = 1 - pUnder15;
      const pUnder25 = probUnder(expH, expA, 2); const pOver25 = 1 - pUnder25;
      const pUnder35 = probUnder(expH, expA, 3); const pOver35 = 1 - pUnder35;
      const pBTTSNo = poisson(expH, 0) + poisson(expA, 0) - (poisson(expH, 0) * poisson(expA, 0));
      const pBTTS = 1 - pBTTSNo;
      const p1X = Math.min(1, aHome + aDraw); const p2X = Math.min(1, aAway + aDraw); const p12 = Math.min(1, aHome + aAway);

      const leanHome = [form, attack, defense, goals, poissonPair, h2h].filter(f => f.home >= f.away + 5).length;
      const leanAway = [form, attack, defense, goals, poissonPair, h2h].filter(f => f.away >= f.home + 5).length;
      const agree = Math.max(leanHome, leanAway);

      // Markets named like TejTips (Full-Time / Over / Under / Half-Time)
      const markets = [
        { id: 'w1', label: 'Full-Time: 1', display: 'Full-Time: 1', prob: aHome, threshold: 0.50 },
        { id: 'w2', label: 'Full-Time: 2', display: 'Full-Time: 2', prob: aAway, threshold: 0.44 },
        { id: 'draw', label: 'Full-Time: X', display: 'Full-Time: X', prob: aDraw, threshold: 0.30 },
        { id: '1x', label: 'Full-Time: 1X', display: 'Full-Time: 1X', prob: p1X, threshold: 0.66 },
        { id: '2x', label: 'Full-Time: X2', display: 'Full-Time: X2', prob: p2X, threshold: 0.62 },
        { id: '12', label: 'Full-Time: 12', display: 'Full-Time: 12', prob: p12, threshold: 0.72 },
        { id: 'ht1', label: 'Half-Time: 1', display: 'Half-Time: 1', prob: pHt1, threshold: 0.42 },
        { id: 'htx', label: 'Half-Time: X', display: 'Half-Time: X', prob: pHtX, threshold: 0.36 },
        { id: 'ht2', label: 'Half-Time: 2', display: 'Half-Time: 2', prob: pHt2, threshold: 0.38 },
        { id: 'over15', label: 'Over: 1.5', display: 'Over: 1.5', prob: pOver15, threshold: 0.70 },
        { id: 'under15', label: 'Under: 1.5', display: 'Under: 1.5', prob: pUnder15, threshold: 0.40 },
        { id: 'over25', label: 'Over: 2.5', display: 'Over: 2.5', prob: pOver25, threshold: 0.55 },
        { id: 'under25', label: 'Under: 2.5', display: 'Under: 2.5', prob: pUnder25, threshold: 0.55 },
        { id: 'over35', label: 'Over: 3.5', display: 'Over: 3.5', prob: pOver35, threshold: 0.34 },
        { id: 'under35', label: 'Under: 3.5', display: 'Under: 3.5', prob: pUnder35, threshold: 0.60 },
        { id: 'over05', label: 'Over: 0.5', display: 'Over: 0.5', prob: pOver05, threshold: 0.82 },
        { id: 'btts', label: 'BTTS: Yes', display: 'BTTS: Yes', prob: pBTTS, threshold: 0.56 },
        { id: 'bttsno', label: 'BTTS: No', display: 'BTTS: No', prob: pBTTSNo, threshold: 0.56 },
      ];
      markets.forEach(m => { m.odds = m.prob > 0.02 ? (1 / m.prob).toFixed(2) : '9.00'; });

      // TejTips tip tactic: favor Over 1.5 / double chance; straight win only when layers agree hard
      let best = null;
      const byId = id => markets.find(m => m.id === id);
      const favHome = overall.home >= overall.away;
      const favPct = Math.max(overall.home, overall.away);

      if (favPct >= 72 && leanHome >= 4 && aHome >= 0.52) best = byId('w1');
      else if (favPct >= 72 && leanAway >= 4 && aAway >= 0.48) best = byId('w2');
      else if (favHome && leanHome >= 3 && edge >= 12 && p1X >= 0.68) best = byId('1x');
      else if (!favHome && leanAway >= 3 && edge <= -12 && p2X >= 0.64) best = byId('2x');
      else if (pOver25 >= 0.58 && expH + expA >= 2.9 && agree >= 2) best = byId('over25');
      else if (pUnder35 >= 0.62 && expH + expA <= 2.35) best = byId('under35');
      else if (pOver15 >= 0.68) best = byId('over15'); // TejTips most common main tip
      else if (Math.abs(edge) <= 7 && aDraw >= 0.28) best = byId('draw');
      else if (favHome && p1X >= 0.70) best = byId('1x');
      else if (!favHome && p2X >= 0.66) best = byId('2x');
      else if (pHt1 >= 0.45 && favHome && leanHome >= 3) best = byId('ht1');
      else if (pHt2 >= 0.42 && !favHome && leanAway >= 3) best = byId('ht2');
      else {
        const preferred = ['over15', '1x', '2x', 'under35', 'over25', 'w1', 'w2'];
        for (const id of preferred) {
          const m = byId(id);
          if (m && m.prob >= m.threshold) { best = m; break; }
        }
        if (!best) {
          const pool = markets.slice().sort((a, b) => (b.prob - b.threshold) - (a.prob - a.threshold));
          best = pool[0];
        }
      }

      const dataQ = hasSample ? 1 : 0.82;
      const agreeBoost = 0.90 + agree * 0.022;
      let conf = Math.round(clamp(best.prob * 100 * agreeBoost * dataQ, 48, 93));
      if (agree >= 5 && favPct >= 75) conf = Math.min(93, conf + 3);

      const predGoalsH = Math.round(expH * 10) / 10 >= Math.floor(expH) + 0.6 ? Math.ceil(expH) : Math.floor(expH);
      const predGoalsA = Math.round(expA * 10) / 10 >= Math.floor(expA) + 0.6 ? Math.ceil(expA) : Math.floor(expA);
      const correctScore = `${Math.max(0, predGoalsH)}–${Math.max(0, predGoalsA)}`;

      let predictedWinner = 'Draw';
      if (overall.home >= overall.away + 4) predictedWinner = home.name || home.shortName || 'Home';
      else if (overall.away >= overall.home + 4) predictedWinner = away.name || away.shortName || 'Away';

      const tipSide = best.id === 'w1' || best.id === '1x' ? (home.shortName || home.name)
        : best.id === 'w2' || best.id === '2x' ? (away.shortName || away.name)
          : best.display;

      const pred = {
        homeW, drawP, awayW, correctScore,
        expH: expH.toFixed(2), expA: expA.toFixed(2),
        over05Prob: Math.round(pOver05 * 100), over15Prob: Math.round(pOver15 * 100), under15Prob: Math.round(pUnder15 * 100),
        over25Prob: Math.round(pOver25 * 100), under25Prob: Math.round(pUnder25 * 100),
        over35Prob: Math.round(pOver35 * 100), under35Prob: Math.round(pUnder35 * 100),
        bttsProb: Math.round(pBTTS * 100), bttsNoProb: Math.round(pBTTSNo * 100),
        dc1xProb: Math.round(p1X * 100), dc2xProb: Math.round(p2X * 100), dc12Prob: Math.round(p12 * 100),
        homeWinProb: homeW, awayWinProb: awayW, drawProb: drawP,
        tipId: best.id, tipLabel: best.label, tipDisplay: best.display, conf, tipOdds: best.odds,
        confLabel: conf >= 82 ? 'VIP' : conf >= 70 ? 'STRONG' : 'VALUE',
        allMarkets: markets,
        predictedWinner,
        tipSide,
        factors: {
          overall, form, attack, defense, goals,
          poisson: poissonPair,
          h2h,
          agree,
          edge,
          h2hGames: meetings.length,
          hasSample
        },
        advice: `Recommendation — ${best.label}. Predicted winner: ${predictedWinner}. ${agree}/6 layers agree (form ${form.home}/${form.away}, attack ${attack.home}/${attack.away}, defense ${defense.home}/${defense.away}, goals ${goals.home}/${goals.away}, Poisson ${poissonPair.home}/${poissonPair.away}, H2H ${h2h.home}/${h2h.away}).`,
        analysis: `TejTips-style stack with venue splits + Poisson. xG ${expH.toFixed(2)}–${expA.toFixed(2)}. Over 1.5 ${Math.round(pOver15 * 100)}% · Over 2.5 ${Math.round(pOver25 * 100)}% · BTTS ${Math.round(pBTTS * 100)}% · HT lean ${Math.round(Math.max(pHt1, pHt2, pHtX) * 100)}%.`
      };

      matchPredictions[match.id] = pred;
      return pred;
    }

    function factorBlock(title, homePct, awayPct, homeName, awayName, note) {
      return `<div class="factor-block">

    /* -- HIT DETECTION -- */
    function checkHit(tipId, sh, sa) {
      const total = sh + sa;
      switch (tipId) {
        case 'over05': return total > 0; case 'over15': return total > 1; case 'under15': return total <= 1;
        case 'over25': return total > 2; case 'over35': return total > 3; case 'under25': return total <= 2; case 'under35': return total <= 3;
        case 'btts': return sh > 0 && sa > 0; case 'bttsno': return !(sh > 0 && sa > 0);
        case 'w1': return sh > sa; case 'w2': return sa > sh; case 'draw': return sh === sa;
        case '1x': return sh >= sa; case '12': return sh !== sa; case '2x': return sa >= sh;
        case 'ht1': case 'ht2': case 'htx': return null; // HT result not in FT score alone
        default: return false;
      }
    }

      });

      if (diverse.length < 4) { for (const s of sorted) { if (!diverse.find(d => d.matchLabel === s.matchLabel)) diverse.push(s); if (diverse.length >= 6) break; } }

          </div>`).join('')}
      </div>
      <div class="coupon-disclaimer">These picks come from a statistical model (Poisson / xG). Football results are never guaranteed — treat this as entertainment and gamble responsibly.</div>`;

    function isNativeApp() {

    async function parseJsonResponse(res) {
      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try { const e = await res.json(); if (e && e.message) msg = e.message; } catch (err) { }
        throw new Error(msg);
      }
      return res.json();
    }

    function fetchWithTimeout(url, opts, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal }))
        .finally(() => clearTimeout(t));
    }

    async function nativeHttpGet(url, headers) {
      const Cap = window.Capacitor;
      const Http = Cap && Cap.Plugins && Cap.Plugins.CapacitorHttp;
      if (!Http) return null;
      const res = await Http.request({ method: 'GET', url: url, headers: headers, connectTimeout: 8000, readTimeout: 10000, responseType: 'json' });
      if (res.status < 200 || res.status >= 300) {
        const data = res.data;
        const msg = (data && data.message) || ('HTTP ' + res.status);
        throw new Error(msg);
      }
      return typeof res.data === 'string' ? JSON.parse(res.data) : res.data;

    async function apiFetch(apiPath, extra = {}) {
      const qs = new URLSearchParams({ path: apiPath, ...extra }).toString();
      const cacheKey = (apiPath + '_' + qs).replace(/[^a-zA-Z0-9_]/g, '_');
      const cached = memCache[cacheKey];
      if (cached && Date.now() - cached.ts < 5 * 60 * 1000) return cached.data;

      const extraQs = new URLSearchParams(extra).toString();
      const directUrl = API_BASE + '/' + apiPath + (extraQs ? '?' + extraQs : '');
      const headers = { 'X-Auth-Token': API_TOKEN };

      let json = null;
      let lastErr = null;

      // 1) Capacitor native HTTP bypasses CORS (CapacitorHttp enabled in capacitor.config.json)
      if (isNativeApp()) {
        try {
          json = await nativeHttpGet(directUrl, headers);
        } catch (e) {
          lastErr = e;
          try {
            json = await parseJsonResponse(await fetchWithTimeout(directUrl, { headers: headers }, 8000));
          } catch (e2) { lastErr = e2; }

      // 2) Hosted proxies (short timeout so we fall through fast)
      if (!json) {
        for (const base of PROXY_BASES) {
          try {
            const res = await fetchWithTimeout(base + '?' + qs, {}, 3000);
            if (res.status === 404) continue;
            json = await parseJsonResponse(res);
            break;
          } catch (e) { lastErr = e; }
        }
      }

      // 3) Direct call last (may work after CapacitorHttp patches window.fetch)
      if (!json) {
        try {
          json = await parseJsonResponse(await fetchWithTimeout(directUrl, { headers: headers }, 6000));
        } catch (e) { lastErr = e; }
      }

      if (!json) throw lastErr || new Error('Could not reach football-data.org');

      memCache[cacheKey] = { ts: Date.now(), data: json };
      return json;
    }

    async function loadStaticCache() {
      const res = await fetch('football-cache.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('No local football cache');
      return res.json();
    }

    /* -- SIDEBAR -- */
    function renderScorers(scorers, listId, cardId) {
      if (!scorers || !scorers.length) { document.getElementById(listId).innerHTML = '<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:0.85rem">No scorer data</div>'; return; }
      document.getElementById(cardId).style.display = 'block';
      document.getElementById(listId).innerHTML = scorers.slice(0, 8).map((s, i) => `
      <div class="scorer-row">
        <div class="scorer-pos">${i + 1}</div>
        <div class="scorer-info"><div class="scorer-name">${s.player?.name || '–'}</div><div class="scorer-club">${s.team?.shortName || s.team?.name || ''}</div></div>
        <div class="scorer-g">${s.goals} <i class="fas fa-futbol" style="font-size:0.7rem"></i></div>
      </div>`).join('');
    }

    function renderStandings(table, bodyId, cardId, max) {
      if (!table || !table.length) { document.getElementById(bodyId).innerHTML = '<div style="padding:14px;text-align:center;color:var(--ink-3);font-size:0.85rem">No table data</div>'; return; }
      document.getElementById(cardId).style.display = 'block';
      document.getElementById(bodyId).innerHTML = `
      <table class="standings-tbl">
        <thead><tr><th>#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody>${table.slice(0, 14).map(row => { const p = row.position; const rel = max >= 18 ? max - 2 : 99; const cls = p <= 4 ? 'pos-cl' : (p >= rel ? 'pos-rel' : ''); return `<tr><td><span class="pos-num ${cls}">${p}</span></td><td class="team-tbl">${row.team?.shortName || row.team?.name || ''}</td><td>${row.playedGames}</td><td>${row.goalDifference >= 0 ? '+' : ''}${row.goalDifference}</td><td class="pts">${row.points}</td></tr>`; }).join('')}</tbody>
      </table>`;
    }

    async function fetchHistoricalData(comp) {
      try {
        const dateTo = todayStr();
        const dateFrom = fmtDate(new Date(Date.now() - 90 * 24 * 60 * 60 * 1000));
        const data = await apiFetch(`competitions/${comp}/matches`, { dateFrom, dateTo });
        const matches = (data.matches || []).slice().sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
        const stats = {};
        const ensure = (id) => {
          if (!stats[id]) stats[id] = { results: [], gf: 0, ga: 0, w: 0, d: 0, l: 0, h2h: {}, homeGf: 0, homeGa: 0, homeN: 0, awayGf: 0, awayGa: 0, awayN: 0 };
          return stats[id];
        };
        matches.filter(m => m.status === 'FINISHED' && m.score?.fullTime).forEach(m => {
          const hId = m.homeTeam.id, aId = m.awayTeam.id;
          const hS = m.score.fullTime.home, aS = m.score.fullTime.away;
          if (hS == null || aS == null) return;
          const h = ensure(hId), a = ensure(aId);
          h.gf += hS; h.ga += aS; a.gf += aS; a.ga += hS;
          h.homeGf += hS; h.homeGa += aS; h.homeN++;
          a.awayGf += aS; a.awayGa += hS; a.awayN++;
          const winner = hS > aS ? hId : (hS < aS ? aId : null);
          if (!h.h2h[aId]) h.h2h[aId] = [];
          if (!a.h2h[hId]) a.h2h[hId] = [];
          h.h2h[aId].push({ winner, hf: hS, af: aS });
          a.h2h[hId].push({ winner, hf: aS, af: hS });
          if (hS > aS) { h.results.push('W'); h.w++; a.results.push('L'); a.l++; }
          else if (hS < aS) { h.results.push('L'); h.l++; a.results.push('W'); a.w++; }
          else { h.results.push('D'); h.d++; a.results.push('D'); a.d++; }
        });
        for (const id in stats) {
          const s = stats[id];
          const count = s.results.length || 1;
          s.avgGf = (s.gf / count).toFixed(2);
          s.avgGa = (s.ga / count).toFixed(2);
          s.winRate = Math.round((s.w / count) * 100);
          s.results = s.results.slice(-10);
        }
        Object.assign(teamStats, stats);
        Object.assign(teamForm, Object.fromEntries(Object.entries(stats).map(([k, v]) => [k, v.results])));
      } catch (e) { console.warn('Historical error (' + comp + '):', e); }
    }

    function renderScorersInto(s) { renderScorers(s, 'scorers-list', 'scorers-card'); renderScorers(s, 'mob-scorers-list', 'mob-scorers-widget'); }
    function renderStandingsInto(table, max) { renderStandings(table, 'standings-body', 'standings-card', max); renderStandings(table, 'mob-standings-body', 'mob-standings-widget', max); }

    async function loadSidebar(compOrFlag = 'PL') {
      // onchange passes a league code; loadMatches may pass true to use the static snapshot.
      const fromCache = compOrFlag === true;
      const comp = fromCache ? 'PL' : (compOrFlag || 'PL');
      document.querySelectorAll('.league-select').forEach(el => el.value = comp);
      const spinner = '<div style="padding:20px;text-align:center;color:var(--ink-3);font-size:0.85rem"><i class="fas fa-circle-notch fa-spin"></i> Loading…</div>';
      ['scorers-list', 'mob-scorers-list', 'standings-body', 'mob-standings-body'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = spinner; });

      if (fromCache && window.__footballCacheSnap) {
        const snap = window.__footballCacheSnap;
        renderScorersInto(snap.scorers?.scorers || []);
        const table = snap.standings?.standings?.find(s => s.type === 'TOTAL')?.table || [];
        leaguePositions = {};
        table.forEach(r => { leaguePositions[r.team.id] = r.position; });
        renderStandingsInto(table, table.length);
        return;
      }

      try { const d = await apiFetch(`competitions/${comp}/scorers`, { limit: 8 }); renderScorersInto(d.scorers || []); } catch (e) { renderScorersInto([]); }
      await sleep(REQ_GAP_MS);
      try { const d = await apiFetch(`competitions/${comp}/standings`); const table = d.standings?.find(s => s.type === 'TOTAL')?.table || []; leaguePositions = {}; table.forEach(r => { leaguePositions[r.team.id] = r.position; }); renderStandingsInto(table, table.length); } catch (e) { renderStandingsInto([], 0); }
    }

    /* -- GROUP BY DAY -- */
    function groupByDay(matches) { const groups = {}; matches.forEach(m => { const key = matchDayKey(m.utcDate); if (!groups[key]) groups[key] = []; groups[key].push(m); }); Object.keys(groups).forEach(k => groups[k].sort((a, b) => sortKey(a.utcDate) - sortKey(b.utcDate))); return groups; }

    /* -- DAY TABS -- */
    function buildDayTabs(groups) {
      const wrap = document.getElementById('day-tabs-wrap'); wrap.style.display = 'flex';
      const offsets = [-2, -1, 0, 1, 2]; const allowedKeys = offsets.map(o => dayKeyForOffset(o)); const todayKey = dayKeyForOffset(0);
      wrap.innerHTML = allowedKeys.map(k => {
        const isToday = k === todayKey; const isActive = k === currentDay; const count = groups[k] ? groups[k].length : 0; const label = isToday ? 'Today' : k;
        return `<button class="day-tab${isActive ? ' active' : ''}" data-day="${k}" onclick="switchDay('${k}',this)">${label}<span class="day-count">${count > 0 ? count + ' game' + (count !== 1 ? 's' : '') : 'none'}</span></button>`;
      }).join('');
    }

    function switchDay(key, el) { currentDay = key; document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); renderDay(dayGroups[key]); }

    /* -- GROUP BY TIME -- */
    function groupByTime(matches) { const groups = {}; matches.forEach(m => { const key = matchTimeStr(m.utcDate); if (!groups[key]) groups[key] = []; groups[key].push(m); }); return groups; }

    /* -- HERO UPDATE -- */
    function updateHero(matches) {
      const featured = matches.find(m => m.status === 'IN_PLAY' || m.status === 'LIVE') || matches[0]; if (!featured) return;
      const home = featured.homeTeam || {}; const away = featured.awayTeam || {};
      document.getElementById('hero-home-crest').innerHTML = home.crest ? `<img src="${home.crest}" onerror="this.style.display='none'" alt="">` : '<i class="fas fa-futbol"></i>';
      document.getElementById('hero-away-crest').innerHTML = away.crest ? `<img src="${away.crest}" onerror="this.style.display='none'" alt="">` : '<i class="fas fa-futbol"></i>';
      document.getElementById('hero-home-name').textContent = home.shortName || home.name || '–';
      document.getElementById('hero-away-name').textContent = away.shortName || away.name || '–';
      const d = new Date(featured.utcDate); const isFinished = featured.status === 'FINISHED';
      if (isFinished) { const sh = featured.score?.fullTime?.home ?? '–', sa = featured.score?.fullTime?.away ?? '–'; document.getElementById('hero-time').textContent = `${sh} – ${sa}`; document.querySelector('.hero-vs').textContent = 'FULL TIME'; }
      else { document.getElementById('hero-time').textContent = matchTimeStr(featured.utcDate); document.querySelector('.hero-vs').textContent = 'KICK-OFF'; }
      document.getElementById('hero-date').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }).toUpperCase();
    }

    /* -- RENDER DAY -- */
    function renderDay(matches) {
      const list = document.getElementById('matches-list'); list.innerHTML = ''; document.getElementById('empty-state').style.display = 'none';
      if (!matches || !matches.length) { document.getElementById('empty-state').style.display = 'block'; return; }
      const timeGroups = groupByTime(matches); const timeKeys = Object.keys(timeGroups);
      timeKeys.forEach((timeKey, gi) => {
        const timeMatches = timeGroups[timeKey]; const groupEl = document.createElement('div'); groupEl.className = 'time-group'; groupEl.style.animationDelay = `${gi * 0.04}s`;
        const timeCol = document.createElement('div'); timeCol.className = 'time-col'; timeCol.textContent = timeKey;
        const matchesCol = document.createElement('div'); matchesCol.className = 'time-matches';
        timeMatches.forEach((m, idx) => { matchesCol.insertAdjacentHTML('beforeend', buildMatchRow(m, `m-${gi}-${idx}`)); });
        groupEl.appendChild(timeCol); groupEl.appendChild(matchesCol); list.appendChild(groupEl);
      });
      updateHero(matches);
    }

    /* -- BUILD MATCH ROW -- */
    function buildMatchRow(m, uid) {
      const pred = computePrediction(m); const home = m.homeTeam || {}; const away = m.awayTeam || {};
      const isFinished = m.status === 'FINISHED'; const isLive = m.status === 'IN_PLAY' || m.status === 'LIVE' || m.status === 'PAUSED';
      const sh = m.score?.fullTime?.home ?? null; const sa = m.score?.fullTime?.away ?? null;
      const statusCls = isFinished ? 's-done' : isLive ? 's-live' : 's-sched';
      const statusLabel = isFinished ? 'FT' : isLive ? 'LIVE' : 'Soon';
      const hCrest = home.crest ? `<img src="${home.crest}" onerror="this.style.display='none'" alt="">` : '<i class="fas fa-futbol"></i>';
      const aCrest = away.crest ? `<img src="${away.crest}" onerror="this.style.display='none'" alt="">` : '<i class="fas fa-futbol"></i>';
      let predStatus = 'pend', predIcon = '<i class="fas fa-clock"></i>';
      if (isFinished && sh !== null && sa !== null) {
        const hit = checkHit(pred.tipId, sh, sa);
        if (hit !== null && hit !== undefined) {
          predStatus = hit ? 'hit' : 'miss';
          predIcon = hit ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>';
        }
      }
      const homeWinner = isFinished && sh !== null && sh > sa; const awayWinner = isFinished && sa !== null && sa > sh;
      const expId = 'exp-' + uid;
      return `
    <div class="match-row" onclick="toggleExp('${expId}')">
      <div class="match-meta">
        <span class="match-comp">${m.competition?.name || ''} · MD${m.matchday || '?'}</span>
        <span class="status-badge ${statusCls}">${statusLabel}</span>
      </div>
      <div class="teams-stack">
        <div class="team-row">
          <div class="tcrest">${hCrest}</div>
          <div class="tname${homeWinner ? ' winner' : ''}">${home.shortName || home.name || '?'}</div>
          ${(isFinished || isLive) && sh !== null ? `<div class="tscore${homeWinner ? ' winner-score' : ''}">${sh}</div>` : `<div class="tscore" style="color:var(--ink-3)"></div>`}
        </div>
        <div class="team-row">
          <div class="tcrest">${aCrest}</div>
          <div class="tname${awayWinner ? ' winner' : ''}">${away.shortName || away.name || '?'}</div>
          ${(isFinished || isLive) && sa !== null ? `<div class="tscore${awayWinner ? ' winner-score' : ''}">${sa}</div>` : `<div class="tscore" style="color:var(--ink-3)"></div>`}
        </div>
      </div>
      <div class="pred-row">
        <div class="pred-pill ${predStatus}">
          <span class="pred-icon ${predStatus}">${predIcon}</span>
          <span class="pred-label">${pred.tipDisplay}</span>
          <span class="pred-value">
            <div class="pv-conf">${pred.conf}%</div>
            <div class="pv-odds">@${pred.tipOdds}</div>
          </span>
          <span class="pred-conf">${pred.confLabel}</span>
        </div>
      </div>
    </div>
    <div class="match-expand" id="${expId}">
      <div class="expand-inner">
        <div class="winner-banner">
          <div class="wb-kicker">Match prediction</div>
          <div class="wb-name">${pred.predictedWinner}</div>
          <div class="wb-sub">Score lean ${pred.correctScore} · xG ${pred.expH} – ${pred.expA} · ${pred.factors.agree}/6 layers agree</div>
        </div>

        <div class="markets-section-label">Match probabilities</div>
        <div class="prob-section">
          <div class="prob-label-row">
            <span class="ph">${home.shortName || 'Home'} ${pred.homeW}%</span>
            <span class="pd">Draw ${pred.drawP}%</span>
            <span class="pa">${pred.awayW}% ${away.shortName || 'Away'}</span>
          </div>
          <div class="prob-bar-row">
            <div class="pb-h" style="flex:${Math.max(1, pred.homeW)}"></div>
            <div class="pb-d" style="flex:${Math.max(1, pred.drawP)}"></div>
            <div class="pb-a" style="flex:${Math.max(1, pred.awayW)}"></div>
          </div>
        </div>

        <div class="advice-box"><strong>Advice</strong> — Recommendation: ${pred.tipLabel} · ${pred.conf}% @${pred.tipOdds}</div>

        ${factorBlock('Overall analysis', pred.factors.overall.home, pred.factors.overall.away, home.shortName || 'Home', away.shortName || 'Away', 'Advantage: ' + pred.predictedWinner + ' (' + (pred.factors.edge >= 0 ? '+' : '') + pred.factors.edge + '%)')}
        ${factorBlock('Form comparison', pred.factors.form.home, pred.factors.form.away, 'Form', 'Form')}
        ${factorBlock('Attack potential', pred.factors.attack.home, pred.factors.attack.away, 'Attack', 'Attack')}
        ${factorBlock('Defensive potential', pred.factors.defense.home, pred.factors.defense.away, 'Defense', 'Defense')}
        ${factorBlock('Goals analysis', pred.factors.goals.home, pred.factors.goals.away, home.shortName || 'Home', away.shortName || 'Away')}
        ${factorBlock('Statistical analysis (Poisson)', pred.factors.poisson.home, pred.factors.poisson.away, home.shortName || 'Home', away.shortName || 'Away', 'Based on Poisson goal distribution from recent averages')}
        ${factorBlock('Historical analysis (H2H)', pred.factors.h2h.home, pred.factors.h2h.away, home.shortName || 'Home', away.shortName || 'Away', pred.factors.h2hGames ? (pred.factors.h2hGames + ' recent meetings') : 'No recent H2H — table strength used')}

        <div class="markets-section-label">All markets</div>
        <div class="markets-grid">
          ${pred.allMarkets.map(mk => {
        const isBest = mk.id === pred.tipId; const pct = Math.round(mk.prob * 100);
        const barColor = pct >= 72 ? 'var(--pitch)' : pct >= 55 ? 'var(--pending)' : 'var(--ink-3)';
        return `<div class="market-row${isBest ? ' market-best' : ''}">
              <span class="market-label">${mk.label}</span>
              <span class="market-pct" style="color:${barColor};display:flex;flex-direction:column;align-items:flex-end;line-height:1.1">
                <span>${pct}%</span>
                <span style="font-size:0.66rem;color:var(--ink-3);">@${mk.odds}</span>
              </span>
              ${isBest ? '<span class="market-pick" style="margin-left:4px;"><i class="fas fa-check"></i></span>' : ''}
            </div>`;
      }).join('')}
        </div>
        <div class="analysis-txt"><strong>Model read</strong> ${pred.analysis}</div>
      </div>
    </div>`;
    }

    function toggleExp(id) { event.stopPropagation(); document.getElementById(id).classList.toggle('open'); }

    /* -- LOAD FIXTURES FROM football-data.org -- */
    async function loadMatches() {
      const from = document.getElementById('date-from').value; const to = document.getElementById('date-to').value;
      setLoading(true); document.getElementById('error-banner').style.display = 'none'; document.getElementById('matches-list').innerHTML = ''; document.getElementById('empty-state').style.display = 'none'; document.getElementById('day-tabs-wrap').style.display = 'none'; document.getElementById('scorers-card').style.display = 'none'; document.getElementById('standings-card').style.display = 'none'; document.getElementById('mob-scorers-widget').style.display = 'none'; document.getElementById('mob-standings-widget').style.display = 'none';
      const params = {}; if (from) params.dateFrom = from; if (to) params.dateTo = to;
      try {
        let data;
        let usedCache = false;
        try {
          // Live football-data.org (native HTTP / proxy / direct)
          data = await apiFetch('matches', params);
        } catch (liveErr) {
          console.warn('Live API failed, using football-cache.json', liveErr);
          const snap = await loadStaticCache();
          data = snap.matches || snap;
          usedCache = true;
          window.__footballCacheSnap = snap;
        }

        allMatches = (data.matches || []).filter(m => ALL_COMP_SET.has(m.competition?.code));
        allMatches.sort((a, b) => sortKey(a.utcDate) - sortKey(b.utcDate));

        setLoading(false);
        if (!allMatches.length) { document.getElementById('empty-state').style.display = 'block'; }
        else {
          dayGroups = groupByDay(allMatches); const todayKey = dayKeyForOffset(0);
          currentDay = dayGroups[todayKey] ? todayKey : Object.keys(dayGroups)[0];
          buildDayTabs(dayGroups); renderDay(dayGroups[currentDay]);
          setTimeout(() => { const at = document.querySelector('.day-tab.active'); if (at) at.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
        }

        if (!usedCache) {
          runSequential(ALL_COMPS.map(c => () => fetchHistoricalData(c))).then(() => {
            matchPredictions = {};
            if (currentDay && dayGroups[currentDay]) renderDay(dayGroups[currentDay]);
          });
        }
        loadSidebar(usedCache);
      } catch (err) {
        setLoading(false);
        const b = document.getElementById('error-banner');
        b.style.display = 'flex';
        document.getElementById('error-msg').textContent = err.message || 'Could not load the card. Try again.';
      }
    }

    function setLoading(on) { document.getElementById('loader').style.display = on ? 'flex' : 'none'; document.getElementById('load-btn').disabled = on; }
    function loadToday() { const t = todayStr(); document.getElementById('date-from').value = t; document.getElementById('date-to').value = t; loadMatches(); }

    function mobileTab(tab, el) {
      document.querySelectorAll('.mnav-btn').forEach(b => b.classList.remove('active')); el.classList.add('active');
      const mainCol = document.getElementById('matches-list'); const emptyState = document.getElementById('empty-state'); const loader = document.getElementById('loader'); const dayTabsWrap = document.getElementById('day-tabs-wrap'); const mobStand = document.getElementById('mob-standings'); const mobScorers = document.getElementById('mob-scorers');
      mobStand.classList.add('hidden'); mobScorers.classList.add('hidden'); mainCol.style.display = 'none'; emptyState.style.display = 'none'; loader.style.display = 'none'; dayTabsWrap.style.display = 'none';
      if (tab === 'matches') { mainCol.style.display = ''; if (dayTabsWrap._has) dayTabsWrap.style.display = 'flex'; if (!mainCol.innerHTML.trim() && currentDay && dayGroups[currentDay]) renderDay(dayGroups[currentDay]); }
      else if (tab === 'standings') { mobStand.classList.remove('hidden'); }
      else if (tab === 'scorers') { mobScorers.classList.remove('hidden'); }
    }

    (function init() { document.getElementById('date-from').value = rangeStart(); document.getElementById('date-to').value = weekEnd(); loadMatches(); })();

    const _orig_buildDayTabs = buildDayTabs;
    buildDayTabs = function (groups) { _orig_buildDayTabs(groups); document.getElementById('day-tabs-wrap')._has = 1; };
  </script>
