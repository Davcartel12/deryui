  <style>
    :root {
      --bg: #07111f;

      --mid: #3ddc84;
      --gold: #f5c451;
      --text: #f0f2f5;
      --muted: #9aa1b1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;

      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;

    .back svg,

      width: 18px;
      height: 18px;
    }

    .title {
      flex: 1;
      text-align: center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .history-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px 10px;
    }

    .history {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: -6px;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex: 0 0 auto;
      min-width: 52px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: rgba(129, 135, 148, 0.12);
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill.mid {
      color: var(--mid);
    }

    .pill.high {
      color: var(--gold);
    }

    .pill.empty {
      color: var(--muted);
      cursor: default;
    }

    .clock {
      flex: 0 0 34px;
      width: 34px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: rgba(129, 135, 148, 0.12);
      color: #ffd27a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clock svg {
      width: 16px;
      height: 16px;
    }

    .stage {
      position: relative;
      margin: 0 12px 12px;
      aspect-ratio: 2.55 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: #1677ff;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .mult {
      position: absolute;
      left: 6%;
      top: 46%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;

    .hud[data-phase="idle"] .mult,
    .hud[data-phase="loading"] .mult {
      left: 0;
      right: 0;
      align-items: center;
      text-align: center;
    }

    .mult-value {
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(34px, 11vw, 48px);
      letter-spacing: -1.1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .mult-value small {
      font-size: 0.56em;
      margin-right: 2px;
      font-weight: 600;

    .mult-label {
      display: none;
      margin-top: 6px;
      color: #ff5d5d;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;

    .hud[data-phase="crashed"] .mult-label,
    .hud[data-phase="waiting"] .mult-label,
    .hud[data-phase="idle"] .mult-label,
    .hud[data-phase="loading"] .mult-label {

    }

    .hud[data-phase="waiting"] .mult-value,
    .hud[data-phase="idle"] .mult-value,

    }

    .hud[data-phase="waiting"] .mult-label,
    .hud[data-phase="idle"] .mult-label,
    .hud[data-phase="loading"] .mult-label {
      color: rgba(255, 255, 255, 0.88);

    .bets {

      padding: 12px 12px 0;

    .bet {
      background: #0e1a2e;

      border-radius: 16px;
      padding: 10px 12px 12px;

    .place {
      position: relative;
      display: block;

      padding: 0 12px 8px;

      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a00 0%, #ffa41b 55%, #ffc24a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(255, 164, 27, 0.38);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      overflow: hidden;
    }

    .place::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 4px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.55);
    }

    .place-label {
      display: block;
      transition: font-size 0.2s, opacity 0.2s;
    }

    .place-value {
      display: none;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .place-value small {
      font-size: 0.6em;
    }

    .place.has-value .place-label {
      font-size: 11px;

    .place.hit {

    .sheet {

      color: #fff;

      font-weight: 800;
      cursor: pointer;

  <script>
    window.Flight = (function () {
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const multEl = document.getElementById("liveMult");
      const labelEl = document.getElementById("multLabel");
      const hudEl = document.getElementById("hud");
      const WAIT_MS = 5000;
      const sheets = { coin: null, vfx: null, curve: null };
      const effects = [
        [538, 91, 48, 49], [646, 92, 45, 47], [754, 92, 48, 42],
        [537, 148, 49, 49], [592, 149, 48, 49], [645, 149, 47, 48],
        [497, 33, 47, 52], [554, 34, 44, 48], [606, 35, 48, 47]
      ].map(function (box) { return { x: box[0], y: box[1], w: box[2], h: box[3] }; });

      function knock(img) {
        const copy = document.createElement("canvas");
        copy.width = img.naturalWidth;
        copy.height = img.naturalHeight;
        const g = copy.getContext("2d");
        g.drawImage(img, 0, 0);
        const image = g.getImageData(0, 0, copy.width, copy.height);
        const px = image.data;
        for (let i = 0; i < px.length; i += 4) {
          if (px[i] + px[i + 1] + px[i + 2] < 36) px[i + 3] = 0;
        }
        g.putImageData(image, 0, 0);
        return copy;
      }

      function loadSheet(name, src) {
        const img = new Image();
        img.onload = function () {
          sheets[name] = knock(img);
        };
        img.src = src;
      }
      loadSheet("coin", "metacrash/coin.png");
      loadSheet("vfx", "metacrash/vfx.png");
      loadSheet("curve", "metacrash/curve.png");

      let W = 0;
      let H = 0;
      let dpr = 1;
      let lastText = "";
      let lastLabel = "";
      let lastPhase = "";
      const sim = {
        state: "loading",
        id: null,
        coef: 1,
        server: 1,
        sampleAt: 0,
        k: 0.09,
        flightStart: 0,
        stop: null,
        crashedAt: 0,
        waitingSince: 0,
        waitEndsAt: 0,
        waitTotal: WAIT_MS
      };

      function resize() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(1, Math.round(rect.width));
        H = Math.max(1, Math.round(rect.height));
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function setPhase(phase, text, label) {
        if (phase !== lastPhase) { hudEl.dataset.phase = phase; lastPhase = phase; }
        if (text != null && text !== lastText) { multEl.innerHTML = "<small>x</small>" + text; lastText = text; }
        if (label != null && label !== lastLabel) { labelEl.textContent = label; lastLabel = label; }
      }

      function headPoint(coef) {
        const alt = Math.log(Math.max(coef, 1)) / Math.LN2;
        const climb = Math.max(0, Math.min(1, alt / 2.4));
        return {
          x: W * (0.64 + climb * 0.14),
          y: H * (0.72 - climb * 0.3)
        };
      }

      function spark(x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r * 0.22, y - r * 0.22);
        ctx.lineTo(x + r, y);
        ctx.lineTo(x + r * 0.22, y + r * 0.22);
        ctx.lineTo(x, y + r);
        ctx.lineTo(x - r * 0.22, y + r * 0.22);
        ctx.lineTo(x - r, y);
        ctx.lineTo(x - r * 0.22, y - r * 0.22);
        ctx.closePath();
        ctx.fill();
      }

      function drawGraph(coef, now, alpha) {
        if (alpha <= 0) return;
        const head = headPoint(coef);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.imageSmoothingEnabled = true;
        const coinH = H * 0.46;
        const coinW = coinH;
        if (sheets.curve) {
          const dw = head.x + coinW * 0.35;
          const dh = (H - head.y) + coinH * 0.42;
          ctx.drawImage(sheets.curve, 0, head.y - coinH * 0.08, dw, dh);
        }
        if (sheets.vfx && effects.length) {
          const fx = effects[Math.floor(now / 80) % effects.length];
          const fw = coinW * 1.35;
          const fh = fw * (fx.h / fx.w);
          ctx.drawImage(sheets.vfx, fx.x, fx.y, fx.w, fx.h, head.x - fw / 2, head.y - fh / 2, fw, fh);
        }
        if (sheets.coin) {
          const frame = Math.floor(now / 90) % 32;
          ctx.drawImage(sheets.coin, 6, frame * 32 + 2, 28, 28, head.x - coinW * 0.5, head.y - coinH * 0.5, coinW, coinH);
        }
        ctx.restore();
      }

      function paintBase() {
        ctx.fillStyle = "#1677ff";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(255,255,255,0.14)";
        ctx.lineWidth = 1;
        const gap = Math.max(28, W / 8);
        for (let x = gap; x < W; x += gap) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = gap; y < H; y += gap) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        spark(W * 0.9, H * 0.22, 3.2);
        spark(W * 0.78, H * 0.78, 2.2);
        spark(W * 0.48, H * 0.18, 2);
      }

      function frame(now) {
        try {
          if (!W) resize();
          paintBase();
          if (sim.state === "flying") {
            const since = (now - sim.sampleAt) / 1000;
            const target = sim.server * Math.exp(sim.k * Math.min(since, 2.5));
            sim.coef += (target - sim.coef) * 0.18;
            drawGraph(sim.coef, now, 1);
            setPhase("flying", sim.coef.toFixed(2), "");
          } else if (sim.state === "crashed") {
            const fade = Math.max(0, 1 - (now - sim.crashedAt) / 700);
            drawGraph(sim.stop || 1, now, fade);
            setPhase("crashed", (sim.stop || 0).toFixed(2), "Crashed");
          } else if (sim.state === "waiting") {
            setPhase("waiting", null, "Waiting for the next round");
          } else if (sim.state === "loading") {
            setPhase("loading", null, "");
          } else {
            setPhase("idle", "--", "Feed unavailable");
          }
        } finally {
          requestAnimationFrame(frame);
        }
      }

      window.addEventListener("resize", function () { W = 0; });
      requestAnimationFrame(frame);

      return {
        update: function (snapshot) {
          const now = performance.now();
          const newRound = snapshot.id != null && snapshot.id !== sim.id;
          if (newRound) sim.id = snapshot.id;

          if (snapshot.stop != null) {
            if (sim.state !== "crashed" || newRound) {
              sim.state = "crashed";
              sim.crashedAt = now;
              sim.stop = Number(snapshot.stop);
              sim.coef = sim.stop;
            }
            return;
          }

          if (snapshot.coef != null) {
            const value = Number(snapshot.coef);
            if (sim.state !== "flying" || newRound) {
              sim.state = "flying";
              sim.coef = value;
              sim.server = value;
              sim.sampleAt = now;
              sim.flightStart = now - (Math.log(Math.max(value, 1.001)) / sim.k) * 1000;
              sim.stop = null;
              return;
            }
            const dt = (now - sim.sampleAt) / 1000;
            if (dt > 0.3 && value > sim.server) {
              const observed = Math.log(value / sim.server) / dt;
              if (isFinite(observed) && observed > 0.01 && observed < 0.6) sim.k = sim.k * 0.7 + observed * 0.3;
            }
            sim.server = value;
            sim.sampleAt = now;
            if (sim.coef > value * 1.02) sim.coef = value;
            return;
          }

          if (sim.state !== "waiting") {
            sim.state = "waiting";
            sim.waitingSince = now;
            sim.waitEndsAt = now + WAIT_MS;
            sim.waitTotal = WAIT_MS;
          }
          if (snapshot.phase === "betting" && snapshot.nextAt && snapshot.changedAt && snapshot.serverNow) {
            sim.waitTotal = Math.max(1000, snapshot.nextAt - snapshot.changedAt);
            sim.waitEndsAt = now + Math.max(0, snapshot.nextAt - snapshot.serverNow);
          } else if (snapshot.phase === "waiting") {
            sim.waitEndsAt = Math.min(sim.waitEndsAt, now);
          }
        },
        idle: function () {
          if (sim.state === "flying" || sim.state === "crashed") return;
          sim.state = "idle";
        }
      };
    })();
  </script>

          const pill = document.createElement("button");
          pill.type = "button";
          pill.className = "pill " + band(round.coef);
          pill.textContent = money(round.coef);
          pill.style.opacity = FADE[Math.min(index, FADE.length - 1)];
          historyBar.appendChild(pill);
        });
      }

      async function fetchHistory() {
        try {
          const res = await fetch(HISTORY_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          const data = await res.json();
          const next = parseRounds(data);
          if (!next.length) return;
          if (!rounds.length) {
            rounds = next.slice(0, 500);
            lastSeenId = rounds[0] && rounds[0].id;
            renderHistory();
            return;
          }
          if (next[0] && next[0].id != null && next[0].id === lastSeenId) return;
          const seen = {};
          rounds.forEach(function (round) { if (round.id != null) seen[round.id] = true; });
          const fresh = next.filter(function (round) { return round.id == null || !seen[round.id]; });
          rounds = fresh.concat(rounds).slice(0, 500);
          lastSeenId = rounds[0] && rounds[0].id;
          renderHistory();
        } catch (error) { /* strip keeps its last contents */ }
      }

      let stateFailures = 0;
      let lastStopId = null;
      async function fetchState() {
        try {
          const res = await fetch(STATE_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          if (!res.ok) throw new Error("state " + res.status);
          const data = await res.json();
          const current = Array.isArray(data.currentCoefficients) ? data.currentCoefficients[0] : null;
          const stop = Array.isArray(data.stopCoefficients) ? data.stopCoefficients[0] : null;
          const id = data.roundConfig && data.roundConfig.id != null ? data.roundConfig.id : null;
          const ms = function (value) { const t = Date.parse(value); return isFinite(t) ? t : null; };
          stateFailures = 0;
          Flight.update({
            id: id, coef: current, stop: stop,
            phase: data.currentState || null,
            changedAt: ms(data.stateChangedAt),
            nextAt: ms(data.nextStateTime),
            serverNow: ms(data.currentTime)
          });
          Predict.sync({ id: id, stop: stop });

          if (stop != null && id != null && id !== lastStopId) {
            lastStopId = id;
            const known = rounds.some(function (round) { return round.id === id; });
            if (!known) {
              rounds = [{ id: id, coef: Number(stop) }].concat(rounds).slice(0, 500);
              lastSeenId = id;
              renderHistory();
            }
          }
        } catch (error) {
          stateFailures++;
          if (stateFailures >= 4) Flight.idle();
        }
      }

      const Predict = (function () {
        const buttons = Array.prototype.slice.call(document.querySelectorAll(".place"));
        const picks = {};
        let roundId = null;
        let roundSettled = false;

        function fmt(value) { return "<small>x</small>" + value.toFixed(2); }

        function draw(min, max) {
          const t = Math.pow(Math.random(), 1.6);
          return Math.round((min + (max - min) * t) * 100) / 100;
        }

        function render(button) {
          const pick = picks[button.dataset.mode];
          const valueEl = button.querySelector(".place-value");
          button.classList.remove("has-value", "hit", "miss");
          if (!pick) {
            valueEl.innerHTML = "";
            return;
          }
          button.classList.add("has-value");
          valueEl.innerHTML = fmt(pick.value);
          if (pick.outcome) button.classList.add(pick.outcome);
        }

        function pickFor(button) {
          picks[button.dataset.mode] = {
            roundId: roundId,
            value: draw(Number(button.dataset.min), Number(button.dataset.max)),
            outcome: null
          };
          render(button);
        }

        buttons.forEach(function (button) {
          button.addEventListener("click", function () {
            const pick = picks[button.dataset.mode];
            if (pick && pick.roundId === roundId) return;
            if (roundSettled) return;
            pickFor(button);
          });
        });

        return {
          sync: function (snapshot) {
            if (snapshot.id != null && snapshot.id !== roundId) {
              roundId = snapshot.id;
              roundSettled = snapshot.stop != null;
              Object.keys(picks).forEach(function (mode) { delete picks[mode]; });
              buttons.forEach(function (button) {
                if (roundSettled) render(button); else pickFor(button);
              });
            }
            if (snapshot.stop != null && !roundSettled) {
              roundSettled = true;
              const stop = Number(snapshot.stop);
              buttons.forEach(function (button) {
                const pick = picks[button.dataset.mode];
                if (pick && pick.roundId === roundId && !pick.outcome) {
                  pick.outcome = stop >= pick.value ? "hit" : "miss";
                  render(button);
                }
              });
            }
          }
        };
      })();

      const sheet = document.getElementById("sheet");
      document.getElementById("infoBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("clockBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("sheetClose").addEventListener("click", function () {
        sheet.classList.remove("show");
      });
      sheet.addEventListener("click", function (event) {
        if (event.target === sheet) sheet.classList.remove("show");
      });

      fetchHistory();
      setInterval(fetchHistory, 5000);
      fetchState();
      setInterval(fetchState, 600);
    })();
  </script>
</body>
