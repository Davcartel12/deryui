<!DOCTYPE html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="UTF-8">
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#050506">
  <title>Coinflip - CHIKE1W</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html { -webkit-text-size-adjust: 100%; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: #050506;
      color: #fff;
      font-family: Inter, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      min-width: 0;
    }

    .coin-wrap {
      position: relative;
      width: min(72vw, 260px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow {
      position: absolute;
      width: 140%;
      height: 140%;
      object-fit: contain;
      opacity: 0.85;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      width: 120%;
      height: auto;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
    }

    .coin-wrap.flipping .wave {
      animation: waveFlash 1.15s ease-out;
    }

    @keyframes waveFlash {
      0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
      35% { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.15); }
    }

    .coin {
      position: relative;
      z-index: 2;
      width: 78%;
      height: auto;
      display: block;
    }

    .coin.tails {
      filter: grayscale(1) brightness(1.2) contrast(1.05);
    }

    .coin-wrap.flipping .coin {
      animation: coinSpin 1.15s ease-in-out;
    }

    @keyframes coinSpin {
      0% { transform: rotateY(0deg) translateY(0); }
      20% { transform: rotateY(180deg) translateY(-28px); }
      40% { transform: rotateY(360deg) translateY(-48px); }
      60% { transform: rotateY(540deg) translateY(-28px); }
      80% { transform: rotateY(720deg) translateY(-8px); }
      100% { transform: rotateY(720deg) translateY(0); }
    }

    .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
    }

    .side {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #141418;
      color: #6e7686;
      border-radius: 999px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .side.on {
      color: #16161f;
      background: #f0c14b;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .signal-btn,
    .reset-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .signal-btn {
      margin-top: 12px;
      padding: 15px;
      background: #00a84f;
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.4px;
    }

    .signal-btn:disabled {
      background: #1a1d24;
      color: #5b6478;
      cursor: not-allowed;
    }

    .reset-btn {
      margin-top: 8px;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8d97ab;
      font-size: 13px;
    }

    .note {
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f0c14b;
    }
  </style>
</head>

<body class="theme-noise">
  <header class="topbar">
    <a class="back" href="login.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <a class="logo-wrap" href="login.html">
      <img src="brand-logo.png" alt="CHIKE1W">
    </a>
    <a class="exit-btn" href="login.html">CHIKE1W</a>
  </header>

  <div class="stage">
    <div class="coin-wrap" id="coinWrap">
      <img class="glow" src="coinflip/glow.png" alt="" draggable="false">
      <img class="wave" src="coinflip/wave.png" alt="" draggable="false">
      <img class="coin" id="coin" src="coinflip/heads.webp" alt="" draggable="false">
    </div>

    <div class="sides">
      <button class="side" id="headsBtn" type="button">Heads</button>
      <button class="side" id="tailsBtn" type="button">Tails</button>
    </div>

    <button class="signal-btn" id="signalBtn" type="button" onclick="flipCoin()">GET SIGNAL</button>
    <button class="reset-btn" type="button" onclick="resetAll()">Reset</button>
    <div class="note" id="note"></div>
  </div>

  <script>
    const coin = document.getElementById('coin');
    const wrap = document.getElementById('coinWrap');
    const headsBtn = document.getElementById('headsBtn');
    const tailsBtn = document.getElementById('tailsBtn');
    const signalBtn = document.getElementById('signalBtn');
    const note = document.getElementById('note');
    let busy = false;

    function cryptoBit() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % 2 === 0;
    }

    function flipCoin() {
      if (busy) return;
      busy = true;
      signalBtn.disabled = true;
      signalBtn.textContent = 'FLIPPING...';
      headsBtn.classList.remove('on');
      tailsBtn.classList.remove('on');
      note.textContent = '';
      wrap.classList.remove('flipping');
      void wrap.offsetWidth;
      wrap.classList.add('flipping');

      const isHeads = cryptoBit();
      setTimeout(function () {
        coin.classList.toggle('tails', !isHeads);
      }, 560);

      setTimeout(function () {
        wrap.classList.remove('flipping');
        headsBtn.classList.toggle('on', isHeads);
        tailsBtn.classList.toggle('on', !isHeads);
        note.textContent = isHeads ? 'HEADS' : 'TAILS';
        signalBtn.textContent = 'GET SIGNAL';
        signalBtn.disabled = false;
        busy = false;
      }, 1180);
    }

    function resetAll() {
      if (busy) return;
      coin.classList.remove('tails');
      headsBtn.classList.remove('on');
      tailsBtn.classList.remove('on');
      note.textContent = '';
    }
  </script>
</body>

</html>
