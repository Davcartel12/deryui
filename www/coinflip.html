<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinflip</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gold: #1e90ff;
            --gold-light: #5eb3ff;
            --gold-dark: #1470c8;
            --ink: #f0f2ff;
            --parchment: #0d0f16;
            --parchment-dark: #07080c;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        body {
            min-height: 100vh;
            background: #07080c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Atmospheric background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
            z-index: 0;
        }

        /* Stars/dust particles */
        .dust {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .dust span {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: var(--gold-light);
            opacity: 0;
            animation: twinkle var(--dur, 4s) var(--delay, 0s) infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: var(--op, 0.6);
                transform: scale(1.2);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            padding: 3rem 2rem;
        }

        /* Header */
        .header {
            text-align: center;
        }

        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.15em;
            text-shadow: 0 0 40px rgba(30, 144, 255, 0.5), 0 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.2;
        }

        .header p {
            margin-top: 0.5rem;
            font-size: 1.05rem;
            font-style: italic;
            color: rgba(245, 237, 216, 0.55);
            letter-spacing: 0.08em;
        }

        /* Ornament */
        .ornament {
            color: var(--gold-dark);
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            opacity: 0.7;
            user-select: none;
        }

        /* Coin scene */
        .coin-scene {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .coin-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
        }

        .coin-img.flipping {
            animation: coinFlip 1.6s ease-in-out forwards;
        }

        @keyframes coinFlip {
            0% {
                transform: scaleX(1) translateY(0px);
            }

            10% {
                transform: scaleX(0) translateY(-20px);
            }

            20% {
                transform: scaleX(1) translateY(-50px);
            }

            30% {
                transform: scaleX(0) translateY(-80px);
            }

            40% {
                transform: scaleX(1) translateY(-100px);
            }

            50% {
                transform: scaleX(0) translateY(-80px);
            }

            60% {
                transform: scaleX(1) translateY(-55px);
            }

            70% {
                transform: scaleX(0) translateY(-30px);
            }

            80% {
                transform: scaleX(1) translateY(-12px);
            }

            90% {
                transform: scaleX(0.6) translateY(-4px);
            }

            100% {
                transform: scaleX(1) translateY(0px);
            }
        }

        /* Prediction display */
        .prediction-area {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .prediction-label {
            font-size: 0.8rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(30, 144, 255, 0.5);
            font-style: normal;
        }

        .prediction-result {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: opacity 0.5s ease, transform 0.5s ease;
            letter-spacing: 0.1em;
        }

        .prediction-result.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .streak-display {
            font-size: 0.85rem;
            font-style: italic;
            color: rgba(245, 237, 216, 0.4);
            letter-spacing: 0.05em;
            min-height: 1.3em;
            transition: color 0.3s;
        }

        .streak-display.hot {
            color: rgba(255, 180, 60, 0.7);
        }

        /* Button */
        .predict-btn {
            position: relative;
            padding: 1rem 3rem;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--ink);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            border: none;
            cursor: pointer;
            clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0% 50%);
            transition: transform 0.15s, filter 0.15s;
            user-select: none;
        }

        .predict-btn::before {
            content: '';
            position: absolute;
            inset: 3px;
            clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .predict-btn:hover:not(:disabled) {
            transform: scale(1.04);
            filter: brightness(1.15) drop-shadow(0 0 15px rgba(30, 144, 255, 0.5));
        }

        .predict-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            color: var(--gold);
            line-height: 1;
        }

        .stat-label {
            margin-top: 0.25rem;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(245, 237, 216, 0.35);
        }

        .stat-divider {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, var(--gold-dark), transparent);
        }

        /* History */
        .history {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            min-height: 28px;
        }

        .history-item {
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--gold-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            font-weight: bold;
            letter-spacing: 0;
            color: var(--gold-light);
            opacity: 0;
            transform: scale(0);
            animation: popIn 0.3s ease forwards;
            font-family: 'Bebas Neue', sans-serif;
            overflow: hidden;
        }

        .history-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes popIn {
            to {
                opacity: 0.75;
                transform: scale(1);
            }
        }

        /* Particles on flip result */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: burst 1s ease-out forwards;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Exit Button */
        .exit-btn {
            margin-top: 2rem;
            padding: 0.8rem 2.5rem;
            border-radius: 8px;
            background: transparent;
            border: 2px solid rgba(30, 144, 255, 0.3);
            color: rgba(245, 237, 216, 0.6);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .exit-btn:hover {
            border-color: var(--gold);
            color: var(--gold-light);
            background: rgba(30, 144, 255, 0.1);
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.2);
        }
    </style>

        function flipCoin() {
            if (isFlipping) return;
            isFlipping = true;

            const btn = document.getElementById('predictBtn');
            const coinImg = document.getElementById('coinImg');
            const result = document.getElementById('predResult');
            const label = document.getElementById('predLabel');

            btn.disabled = true;
            result.classList.remove('visible');
            label.style.opacity = '0';

            const flip = RngGames.fairCoinFlip({ random: BotRng.cryptoRandom }); const isHeads = flip.side === 'heads';

            // Start animation
            coinImg.classList.add('flipping');

            // Swap image at the midpoint (when coin is "edge-on" at ~800ms)
            setTimeout(() => {
                coinImg.src = isHeads ? HEADS_SRC : TAILS_SRC;
            }, 800);

            // Animation ends at 1600ms
            setTimeout(() => {
                coinImg.classList.remove('flipping');

                // Show result
                result.textContent = isHeads ? 'HEADS' : 'TAILS';
                result.classList.add('visible');
                label.style.opacity = '1';

                // Update stats
                total++;
                if (isHeads) heads++; else tails++;
                document.getElementById('headsCount').textContent = heads;
                document.getElementById('tailsCount').textContent = tails;
                document.getElementById('totalCount').textContent = total;

                // Streak
                if (lastResult === (isHeads ? 'H' : 'T')) {
                    streak++;
                } else {
                    streak = 1;
                    lastResult = isHeads ? 'H' : 'T';
                }

                const streakEl = document.getElementById('streakDisplay');
                if (streak >= 3) {
                    streakEl.textContent = `🔥 ${streak} in a row!`;
                    streakEl.classList.add('hot');
                } else {
                    streakEl.textContent = total > 0 ? `${Math.round(heads / total * 100)}% heads overall` : '';
                    streakEl.classList.remove('hot');
                }

                history.push(isHeads ? 'H' : 'T');
                if (history.length > 12) history.shift();
                renderHistory();
                burst(isHeads);

                setTimeout(() => {
                    isFlipping = false;
                    btn.disabled = false;
                }, 200);

            }, 1600);
        }

        function renderHistory() {
            const el = document.getElementById('history');
            el.innerHTML = '';
            history.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.animationDelay = '0s';
                const img = document.createElement('img');
                img.src = r === 'H' ? HEADS_SRC : TAILS_SRC;
                img.alt = r === 'H' ? 'H' : 'T';
                div.appendChild(img);
                el.appendChild(div);
            });
        }

        function burst(isHeads) {
            const container = document.getElementById('particles');
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2 - 40;

            for (let i = 0; i < 18; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.5;
                const dist = 80 + Math.random() * 120;
                p.style.cssText = `
        left: ${cx}px; top: ${cy}px;
        --tx: ${Math.cos(angle) * dist}px;
        --ty: ${Math.sin(angle) * dist}px;
        background: ${isHeads ? '#5eb3ff' : '#1e90ff'};
        width: ${4 + Math.random() * 6}px;
        height: ${4 + Math.random() * 6}px;
        animation-duration: ${0.6 + Math.random() * 0.6}s;
        animation-delay: ${Math.random() * 0.1}s;
      `;
                container.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }
    </script>
</body>

</html>
