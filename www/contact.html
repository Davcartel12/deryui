<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact - APNAJ</title>
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1e90ff;
      --accent2: #ff4f4f;
      --bg: #07080c;
      --surface: #0d0f16;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f0f2ff;
      --muted: rgba(240, 242, 255, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(7, 8, 12, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-wrap img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .logo-wrap span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      color: var(--accent);
      line-height: 1;
    }

    .promo-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .promo-tag span {
      -webkit-text-fill-color: var(--text);
      color: var(--muted);
      font-weight: 400;
      margin-right: 4px;
    }

    /* ── PAGE CONTENT ── */
    .page-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 120px;
    }

    .page-heading {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 4px;
      color: var(--text);
      margin-bottom: 6px;
      text-align: center;
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── CONTACT CARD ── */
    .contact-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: #fff;
      transition: transform .2s, box-shadow .2s, filter .2s;
      letter-spacing: .3px;
    }

    .contact-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .contact-link svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .telegram-group {
      background: linear-gradient(135deg, #229ED9, #1a7fb0);
      box-shadow: 0 6px 20px rgba(34, 158, 217, 0.3);
    }

    .telegram-chat {
      background: linear-gradient(135deg, #0088cc, #006fa8);
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.3);
    }

    .whatsapp {
      background: linear-gradient(135deg, #25D366, #1aaa52);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: rgba(7, 8, 12, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }

    .nav-item {
      flex: 1;
      max-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      transition: color .2s;
      padding: 4px 0;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    .nav-item .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      margin-top: -2px;
      transition: opacity .2s;
    }

    .nav-item.active .dot {
      opacity: 1;
    }
  </style>
</head>
