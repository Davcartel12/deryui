    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #07080c;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            min-height: 100svh;
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .topbar {
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px !important;
        }

        .screen {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            background-color: #07080c;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px));
            gap: 14px;
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .grid-wrapper {
            width: 100%;
            background: linear-gradient(145deg, #0d0f16, #0a0c14);
            border-radius: 18px;
            padding: 10px;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.05),
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .tile {
            width: auto;
            height: auto;
            aspect-ratio: 1 / 1;
            min-width: 0;
            border-radius: 10px;
            background-image: url('https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/6f2e9003-5bb5-47bc-b5b8-8d8fc3341b15.png');
            background-size: cover;
            background-position: center;
            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4),
                0 1px 3px rgba(0, 200, 200, 0.15);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .tile:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .control-panel {
            background: linear-gradient(160deg, #0d0f16, #0a0c14);
            border-radius: 18px;
            padding: 14px 14px 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.05),
                0 6px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Segmented selector */
        .trap-selector-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trap-selector-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.03em;
        }

        .segmented-control {
            display: flex;
            background: #111d2e;
            border-radius: 14px;
            padding: 5px;
            gap: 4px;
            width: 100%;
        }

        .seg-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: rgba(255, 255, 255, 0.45);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
            user-select: none;
            letter-spacing: 0.01em;
        }

        .seg-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .seg-btn.active {
            background: #1e2f44;
            color: #ffffff;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.06);
        }

        .play-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #1e90ff 0%, #1470c8 100%);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow:
                0 4px 16px rgba(30, 100, 220, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .play-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30, 100, 220, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .play-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(30, 100, 220, 0.35);
        }

        .exit-btn {
            display: none;
            margin-top: 10px;
            padding: 12px 40px;
            border-radius: 12px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .exit-btn:hover {
            border-color: #1e90ff;
            color: #fff;
            background: rgba(47, 128, 245, 0.1);
        }
    </style>

    <script>
        const TILE_IMG = 'https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/6f2e9003-5bb5-47bc-b5b8-8d8fc3341b15.png';
        const TRAP_IMG = 'https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/84e70fca-9ec4-4197-8774-d865f2d8ff57.png';

        const TRAP_OPTIONS = [2, 3, 5, 7];
        const TRAP_COUNTS = { 2: 7, 3: 5, 5: 3, 7: 2 };

        // Build grid
        const grid = document.getElementById('grid');
        const tiles = [];
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            grid.appendChild(tile);
            tiles.push(tile);
        }

        // Segmented control
        let trapIndex = 1; // default: 3
        const segBtns = document.querySelectorAll('.seg-btn');

        segBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                trapIndex = parseInt(btn.dataset.index);
                segBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                resetGrid();
            });
        });

        function resetGrid() {
            tiles.forEach(t => {
                t.style.backgroundImage = "url('" + TILE_IMG + "')";
            });
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            resetGrid();
            const trapVal = TRAP_OPTIONS[trapIndex];
            const numTraps = TRAP_COUNTS[trapVal];
            const indices = shuffle([...Array(25).keys()]).slice(0, numTraps);
            indices.forEach(i => {
                tiles[i].style.backgroundImage = "url('" + TRAP_IMG + "')";
            });
        });
    </script>
