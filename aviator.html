<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Signal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            background:
                radial-gradient(circle at center, rgba(180, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.95) 100%),
                url("https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/5c9e6454-c9d7-4879-8873-75e1c670b345.avif") no-repeat center center;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* === LOADER TOP BAR === */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 34, 0, 0.15);
            z-index: 999;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff2200, #ff8800);
            box-shadow: 0 0 10px rgba(255, 34, 0, 0.8);
            transition: width 11s cubic-bezier(0.1, 0.05, 0.3, 1);
        }

        /* === HEADER === */
        .header {
            position: relative;
            z-index: 2;
            margin-top: 24px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ff2200;
            text-shadow: 0 0 20px rgba(255, 34, 0, 0.6);
        }

        /* === CENTER === */
        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            gap: 24px;
        }

        /* === CIRCLE === */
        .circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 5px solid #ff2200;
            box-shadow: 0 0 50px rgba(255, 34, 0, 0.8), inset 0 0 30px rgba(255, 34, 0, 0.1);
            background: rgba(0, 0, 0, 0.78);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
        }

        .signal {
            font-size: 13px;
            color: #ffd54a;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .multiplier {
            font-size: 36px;
            font-weight: 900;
            color: white;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        /* === INFO BELOW CIRCLE === */
        .info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-label {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
        }

        .time-value {
            font-size: 17px;
            font-weight: 700;
            color: #ffd54a;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 213, 74, 0.5);
        }

        .chance-value {
            font-size: 17px;
            font-weight: 700;
            color: #44ff88;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(68, 255, 136, 0.5);
        }

        .countdown-value {
            font-size: 17px;
            font-weight: 700;
            color: #ff6644;
            letter-spacing: 2px;
        }

        /* === FOOTER === */
        .footer {
            position: relative;
            z-index: 2;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .get-btn {
            padding: 16px 60px;
            border-radius: 14px;
            background: linear-gradient(135deg, #cc1100, #ff4400);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 25px rgba(255, 34, 0, 0.5);
            text-transform: uppercase;
        }

        .get-btn:hover {
            box-shadow: 0 0 40px rgba(255, 34, 0, 0.8);
            transform: translateY(-2px);
        }

        .get-btn:disabled {
            background: rgba(60, 20, 10, 0.8);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .exit-btn {
            padding: 12px 44px;
            border-radius: 14px;
            background: transparent;
            border: 2px solid #ff2200;
            color: #ff2200;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .exit-btn:hover {
            background: #ff2200;
            color: black;
        }
    </style>
</head>

<body>

    <!-- Page loader -->
    <div id="pg-loader"
        style="position:fixed;inset:0;z-index:99999;background:url('https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/5c9e6454-c9d7-4879-8873-75e1c670b345.avif') center/cover no-repeat;">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.65);"></div>
        <div
            style="position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;">
            <div style="font-weight:900;font-size:30px;color:#fff;letter-spacing:5px;text-shadow:0 0 25px #ff2200;">
                AVIATOR</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:4px;">LOADING PREDICTOR...</div>
            <div
                style="width:72%;max-width:300px;background:rgba(255,255,255,0.15);border-radius:50px;overflow:hidden;height:7px;margin-top:4px;">
                <div id="pg-bar"
                    style="height:100%;width:1%;background:linear-gradient(90deg,#ff2200,#ff8800);border-radius:50px;transition:width 0.06s linear;">
                </div>
            </div>
            <div id="pg-pct" style="color:#fff;font-weight:900;font-size:14px;letter-spacing:3px;opacity:0.85;">1%</div>
        </div>
    </div>

    <script>
        (function () {
            var dur = 5000 + Math.random() * 5000;
            var p = 1;
            var b = document.getElementById('pg-bar');
            var t = document.getElementById('pg-pct');
            var o = document.getElementById('pg-loader');
            var iv = setInterval(function () {
                p += Math.floor(Math.random() * 4) + 1;
                if (p >= 100) {
                    p = 100; clearInterval(iv);
                    setTimeout(function () {
                        o.style.transition = 'opacity 0.6s'; o.style.opacity = '0';
                        setTimeout(function () { o.remove(); }, 650);
                    }, 200);
                }
                b.style.width = p + '%'; t.textContent = p + '%';
            }, Math.round(dur / 40));
        })();
    </script>

    <!-- Top progress bar -->
    <div class="loader">
        <div class="bar"></div>
    </div>

    <div class="header">AVIATOR</div>

    <div class="center-area">

        <div class="circle">
            <div class="signal">PREDICTION ✅</div>
            <div class="multiplier" id="result">—</div>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Time:</span>
                <span class="time-value" id="time">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Chance:</span>
                <span class="chance-value" id="chance">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Next in:</span>
                <span class="countdown-value" id="timers"></span>
            </div>
        </div>

    </div>

    <div class="footer">
        <button class="get-btn" id="startButton" onclick="generateRandomNumber()">GET SIGNAL</button>
        <button class="exit-btn" onclick="goBack()">EXIT</button>
    </div>

    <script>
        var isLoading = false;
        var isReturningToInitialState = false;

        function goBack() {
            window.location.href = 'login.html';
        }

        function generateRandomNumber() {
            if (isLoading || isReturningToInitialState) return;
            isLoading = true;
            document.querySelector('.bar').style.width = '0%';
            setTimeout(function () {
                document.querySelector('.bar').style.width = '100%';
                setTimeout(function () {
                    document.querySelector('.bar').style.width = '0%';
                    isReturningToInitialState = true;
                    isLoading = false;
                }, 11000);
                setTimeout(function () { isReturningToInitialState = false; }, 22000);
                setTimeout(showText, 10000);
            }, 100);
        }

        function getRan(min, max) { return Math.random() * (max - min) + min; }
        function pad(n) { return (n < 10 ? '0' : '') + n; }

        function showText() {
            let d = new Date();
            d.setSeconds(d.getSeconds() + 30);
            let t1 = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            d.setMinutes(d.getMinutes() + 1);
            let t2 = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            let timeText = `${t1} — ${t2}`;
            let r1 = getRan(2, 3).toFixed(2);
            let r2 = getRan(4, 7).toFixed(2);
            let r3 = getRan(86, 97).toFixed(0);
            let resultText = `${r1}x — ${r2}x`;
            let chanceText = `${r3}%`;

            document.getElementById("result").textContent = resultText;
            document.getElementById("time").textContent = timeText;
            document.getElementById("chance").textContent = chanceText;

            localStorage.setItem('timeText', timeText);
            localStorage.setItem('resultText', resultText);
            localStorage.setItem('chanceText', chanceText);
        }

        function restoreState() {
            if (localStorage.getItem('resultText')) document.getElementById("result").textContent = localStorage.getItem('resultText');
            if (localStorage.getItem('timeText')) document.getElementById("time").textContent = localStorage.getItem('timeText');
            if (localStorage.getItem('chanceText')) document.getElementById("chance").textContent = localStorage.getItem('chanceText');
        }

        document.addEventListener("DOMContentLoaded", restoreState);

        // === TIMER ===
        let countdown;
        let timerRunning = false;
        const timerDisplay = document.getElementById('timers');
        const startButton = document.getElementById('startButton');

        function saveTimerState(tl) { localStorage.setItem('timeLeft', tl); localStorage.setItem('timestamp', Date.now()); }
        function clearTimerState() { localStorage.removeItem('timeLeft'); localStorage.removeItem('timestamp'); }

        function startTimer(duration) {
            let timeLeft = duration;
            countdown = setInterval(function () {
                let m = parseInt(timeLeft / 60, 10);
                let s = parseInt(timeLeft % 60, 10);
                timerDisplay.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                if (--timeLeft < 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = '';
                    startButton.removeAttribute('disabled');
                    timerRunning = false;
                    clearTimerState();
                } else { saveTimerState(timeLeft); }
            }, 1000);
        }

        function restoreTimer() {
            let sl = localStorage.getItem('timeLeft');
            let st = localStorage.getItem('timestamp');
            if (sl && st) {
                let tl = sl - Math.floor((Date.now() - st) / 1000);
                if (tl > 0) { startTimer(tl); timerRunning = true; startButton.setAttribute('disabled', 'true'); }
                else { clearTimerState(); }
            }
        }

        function initializeTimer() {
            startButton.addEventListener('click', function () {
                if (countdown) { clearInterval(countdown); timerDisplay.textContent = ''; timerRunning = false; clearTimerState(); }
                if (!timerRunning) {
                    startButton.setAttribute('disabled', 'true');
                    timerDisplay.style.display = 'none';
                    setTimeout(() => {
                        startTimer(60);
                        timerDisplay.style.display = 'block';
                        timerRunning = true;
                    }, 9100);
                }
            });
            restoreTimer();
        }

        initializeTimer();
    </script>
</body>

</html>
