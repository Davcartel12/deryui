<!doctype html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090d1c" />
  <title>Lucky Jet - CHIKE1W</title>
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d1c;
      --panel: #171e38;
      --line: rgba(255, 255, 255, 0.08);
      --blue: #2f7bff;
      --mid: #6d4dff;
      --gold: #f0b429;
      --text: #ffffff;
      --muted: #93a0c2;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    }

    .back,
    .info {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .back svg,
    .info svg {
      width: 18px;
      height: 18px;
    }

    .title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .history-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px 10px;
    }

    .history {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: -6px;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .pill {
      position: relative;
      flex: 0 0 auto;
      min-width: 64px;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .pill.mid {
      background: var(--mid);
    }

    .pill.high {
      background: linear-gradient(135deg, #ff8a00 0%, #ffa41b 55%, #ffc24a 100%);
      color: #fff;
    }

    .pill.now {
      background: var(--blue);
      cursor: default;
    }

    .pill.now::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 2px;
      transform: translateX(-50%) rotate(45deg);
      clip-path: polygon(0 100%, 100% 100%, 100% 0);
    }

    .pill.empty {
      background: #1c2444;
      color: var(--muted);
      cursor: default;
    }

    .clock {
      flex: 0 0 34px;
      width: 34px;
      height: 32px;
      border: 0;
      border-radius: 9px;
      background: #2a2152;
      color: #d6c9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clock svg {
      width: 18px;
      height: 18px;
    }

    .title img {
      height: 16px;
      width: auto;
      display: inline-block;
      vertical-align: middle;
    }

    .stage {
      position: relative;
      margin: 0 12px;
      aspect-ratio: 2 / 1;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(124, 92, 255, 0.35);
      background: linear-gradient(180deg, #1c1547 0%, #171240 55%, #120d33 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 14px;
      bottom: 14px;
      width: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .mult {
      position: absolute;
      left: 7%;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      text-align: left;
    }

    .hud[data-phase="flying"] .mult,
    .hud[data-phase="crashed"] .mult,
    .hud[data-phase="idle"] .mult {
      display: block;
    }

    .hud[data-phase="crashed"] .mult {
      left: 0;
      right: 0;
      text-align: center;
    }

    .mult-value {
      font-size: clamp(44px, 14vw, 58px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
      color: #fff;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .mult-value small {
      font-size: 0.62em;
      font-weight: 800;
      letter-spacing: 0;
    }

    .hud[data-phase="crashed"] .mult-value {
      color: #9f6bff;
      background: linear-gradient(180deg, #b990ff 0%, #8a52ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    .mult-label {
      display: none;
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #fff;
    }

    .hud[data-phase="crashed"] .mult-label,
    .hud[data-phase="idle"] .mult-label {
      display: block;
    }

    .hud[data-phase="idle"] .mult-label {
      font-size: 13px;
      color: var(--muted);
    }

    .wait {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 24px 0 28px;
    }

    .hud[data-phase="waiting"] .wait {
      display: flex;
    }

    .wait-icon {
      position: relative;
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
    }

    /* Same artwork twice: the outer ring spins, the jetpack in the middle bobs. */
    .wait-icon::before,
    .wait-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("luckyjet/loader.png") center / 100% 100% no-repeat;
    }

    .wait-icon::before {
      -webkit-mask: radial-gradient(circle at 50% 50%, transparent 33%, #000 34%);
      mask: radial-gradient(circle at 50% 50%, transparent 33%, #000 34%);
      animation: spin 2.4s linear infinite;
    }

    .wait-icon::after {
      clip-path: circle(33% at 50% 50%);
      animation: bounce 1.2s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(-2.5px); }
      50% { transform: translateY(2.5px); }
    }

    .wait-text {
      min-width: 0;
      flex: 0 1 300px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
      text-transform: uppercase;
      color: #fff;
    }

    .bar {
      margin-top: 10px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: #8a52ff;
      transition: width 0.3s linear;
    }

    .loader {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(19, 15, 54, 0.92);
      transition: opacity 0.4s;
    }

    .loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader .wait-icon {
      width: 84px;
      height: 84px;
    }

    .bets {
      display: grid;
      gap: 10px;
      padding: 12px 12px 0;
    }

    .bet {
      background: #16123a;
      border: 1px solid rgba(124, 92, 255, 0.18);
      border-radius: 16px;
      padding: 10px 12px 12px;
    }

    .place {
      position: relative;
      display: block;
      width: 100%;
      height: 76px;
      padding: 0 12px 8px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a00 0%, #ffa41b 55%, #ffc24a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(255, 164, 27, 0.38);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      overflow: hidden;
    }

    .place::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 4px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.55);
    }

    .place-label {
      display: block;
      transition: font-size 0.2s, opacity 0.2s;
    }

    .place-value {
      display: none;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .place-value small {
      font-size: 0.6em;
    }

    .place.has-value .place-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.85;
      margin-bottom: 3px;
    }

    .place.has-value .place-value {
      display: block;
    }

    .place.hit {
      background: linear-gradient(135deg, #0f9d58 0%, #22c55e 60%, #5ee39a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .place.miss {
      background: linear-gradient(135deg, #b42318 0%, #e0442f 60%, #ff7a66 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(224, 68, 47, 0.35);
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(5, 8, 18, 0.62);
      display: none;
      align-items: flex-end;
    }

    .sheet.show {
      display: flex;
    }

    .sheet-card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #141b33;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
    }

    .sheet-card h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .sheet-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .sheet-card button {
      margin-top: 14px;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .place[disabled] {
      opacity: 1;
      cursor: default;
    }

    .status {
      margin: 10px 16px 0;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .status.pulsing {
      color: #d6c9ff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .signal-bar {
      margin: 8px 12px 0;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .signal-bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: #8a52ff;
      transition: width 0.4s ease;
    }
  </style>
</head>

<body>
  <div class="app">
  <header class="topbar">
      <a class="back" href="login.html" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
      <div class="title"><img src="luckyjet/logo.png" alt="Lucky Jet"></div>
      <button class="info" type="button" id="infoBtn" aria-label="About this screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      </button>
  </header>

    <div class="history-wrap">
      <div class="history" id="historyBar">
        <button class="pill now" type="button">?</button>
      </div>
      <button class="clock" type="button" id="clockBtn" aria-label="Full history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </div>

    <section class="stage" id="stage">
      <canvas id="sky"></canvas>
      <div class="hud" id="hud" data-phase="loading">
        <div class="mult">
          <div class="mult-value" id="liveMult"><small>x</small>--</div>
          <div class="mult-label" id="multLabel">Flew away</div>
        </div>
        <div class="wait">
          <div class="wait-icon" aria-hidden="true"></div>
          <div class="wait-text">
            <div>Waiting for<br>the next round</div>
            <div class="bar"><i id="waitBar"></i></div>
          </div>
        </div>
      </div>
      <div class="loader" id="loader"><div class="wait-icon" aria-hidden="true"></div></div>
    </section>

    <div class="bets">
      <article class="bet" id="coefficientBox">
        <button type="button" class="place" id="newSignalBtn">
          <span class="place-label">GET SIGNAL</span>
          <strong class="place-value" id="coeffValue"></strong>
        </button>
        <div class="signal-bar"><i id="progressFill"></i></div>
      </article>
      <article class="bet">
        <button type="button" class="place has-value" id="chanceBox" disabled>
          <span class="place-label">CHANCE</span>
          <strong class="place-value" id="chanceDisplay">00%</strong>
        </button>
      </article>
      <article class="bet">
        <button type="button" class="place has-value" id="timeBox" disabled>
          <span class="place-label">TIME WINDOW</span>
          <strong class="place-value" id="apiTimeWindow">--:--</strong>
        </button>
      </article>
    </div>
    <div class="status" id="statusDisplay"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <h2>Lucky Jet</h2>
      <p>The flight on this screen follows the live Lucky Jet round. GET SIGNAL is this page's predictor. It does not tell you where the round will stop.</p>
      <button type="button" id="sheetClose">Close</button>
    </div>
  </div>

  <script>
    window.Flight = (function () {
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const multEl = document.getElementById("liveMult");
      const labelEl = document.getElementById("multLabel");
      const hudEl = document.getElementById("hud");
      const waitBar = document.getElementById("waitBar");
      const loaderEl = document.getElementById("loader");
      const WAIT_MS = 5000; // fallback: the gateway's "betting" state lasts 5 s
      const joe = new Image();
      const flame = new Image();
      const clouds = new Image();
      joe.src = "luckyjet/joe.webp";
      flame.src = "luckyjet/flame.webp";
      clouds.src = "luckyjet/clouds.png";

      let W = 0;
      let H = 0;
      let dpr = 1;
      let frames = [];
      let stars = [];
      let cloudX = 0;
      let lastText = "";
      let lastLabel = "";
      let lastPhase = "";
      let lastBar = -1;
      // Live state fed from the game gateway. "coef" is what we draw; "server" is the last value received.
      const sim = {
        state: "loading",   // loading | waiting | flying | crashed | idle
        id: null,
        coef: 1,
        server: 1,
        sampleAt: 0,
        k: 0.09,            // observed growth per second, refined from consecutive samples
        flightStart: 0,
        stop: null,
        crashedAt: 0,
        waitingSince: 0,
        waitEndsAt: 0,      // local time when the countdown reaches zero
        waitTotal: WAIT_MS
      };

      function resize() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(1, Math.round(rect.width));
        H = Math.max(1, Math.round(rect.height));
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!stars.length) {
          for (let i = 0; i < 46; i++) {
            stars.push({ x: Math.random(), y: Math.random() * 0.75, r: 0.6 + Math.random() * 1.4, p: Math.random() * Math.PI * 2 });
          }
        }
      }

      function sliceFrames() {
        try {
          const probe = document.createElement("canvas");
          probe.width = flame.naturalWidth;
          probe.height = flame.naturalHeight;
          const px = probe.getContext("2d");
          px.drawImage(flame, 0, 0);
          const data = px.getImageData(0, 0, probe.width, probe.height).data;
          const found = [];
          let start = -1;
          for (let col = 0; col <= probe.width; col++) {
            let opaque = false;
            if (col < probe.width) {
              for (let row = 0; row < probe.height; row += 2) {
                if (data[(row * probe.width + col) * 4 + 3] > 24) { opaque = true; break; }
              }
            }
            if (opaque && start < 0) start = col;
            if (!opaque && start >= 0) {
              if (col - start > 8) found.push({ sx: start, sw: col - start });
              start = -1;
            }
          }
          if (found.length >= 4) { frames = found; return; }
        } catch (error) { /* tainted canvas: fall through to even slicing */ }
        const count = 13;
        const width = flame.naturalWidth / count;
        frames = [];
        for (let i = 0; i < count; i++) frames.push({ sx: i * width, sw: width });
      }
      flame.onload = sliceFrames;

      function pathPoint(p) {
        const ax = 0.05 * W, ay = 0.92 * H;
        const cx = 0.46 * W, cy = 0.92 * H;
        const bx = 0.64 * W, by = 0.72 * H;
        const q = 1 - p;
        return {
          x: q * q * ax + 2 * q * p * cx + p * p * bx,
          y: q * q * ay + 2 * q * p * cy + p * p * by
        };
      }

      function setPhase(phase, text, label) {
        if (phase !== lastPhase) { hudEl.dataset.phase = phase; lastPhase = phase; }
        if (text != null && text !== lastText) { multEl.innerHTML = "<small>x</small>" + text; lastText = text; }
        if (label != null && label !== lastLabel) { labelEl.textContent = label; lastLabel = label; }
      }

      function setWaitBar(fraction) {
        const pct = Math.round(Math.max(0, Math.min(1, fraction)) * 100);
        if (pct === lastBar) return;
        // Snap when the bar refills for a new round; ease while it drains.
        waitBar.style.transition = pct > lastBar ? "none" : "";
        waitBar.style.width = pct + "%";
        lastBar = pct;
      }

      function sparkle(x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.quadraticCurveTo(x, y, x, y + r);
        ctx.quadraticCurveTo(x, y, x - r, y);
        ctx.quadraticCurveTo(x, y, x, y - r);
        ctx.fill();
      }

      function drawStars(now, drift) {
        ctx.fillStyle = "#ffffff";
        stars.forEach(function (star) {
          if (drift) { star.x -= drift * 0.00008 * (0.5 + star.r); if (star.x < -0.02) star.x = 1.02; }
          const twinkle = 0.45 + 0.55 * Math.abs(Math.sin(now / 900 + star.p));
          ctx.globalAlpha = twinkle;
          if (star.r > 1.5) {
            sparkle(star.x * W, star.y * H, star.r * 3);
          } else {
            ctx.beginPath();
            ctx.arc(star.x * W, star.y * H, star.r, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        ctx.globalAlpha = 1;
      }

      function drawClouds(drift) {
        if (!clouds.complete || !clouds.naturalWidth) return;
        const h = H * 0.42;
        const w = h * clouds.naturalWidth / clouds.naturalHeight;
        cloudX -= drift * 0.012;
        if (cloudX <= -w) cloudX += w;
        ctx.globalAlpha = 0.16;
        for (let x = cloudX; x < W + w; x += w) ctx.drawImage(clouds, x, H - h + 8, w, h);
        ctx.globalAlpha = 1;
      }

      function drawCurve(p) {
        if (p <= 0) return;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#8a5cff";
        ctx.lineWidth = 4;
        ctx.shadowColor = "rgba(138, 92, 255, 0.85)";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        const steps = 40;
        for (let i = 0; i <= steps; i++) {
          const pt = pathPoint(p * i / steps);
          if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // (x, y) is where the trail ends: the tip of the exhaust flame. Joe sits up and to the right of it,
      // leaning into the climb, with the flame leaving the jetpack nozzle behind his back.
      const LEAN = 0.1;
      function drawJoe(x, y, now, boost) {
        if (!joe.complete || !joe.naturalWidth) return;
        const h = H * 0.4;
        const w = h * joe.naturalWidth / joe.naturalHeight;
        const bob = Math.sin(now / 320) * 3;
        const fh = h * (0.5 + boost * 0.14);
        // Nozzle position in Joe's local frame (origin at his centre). Flame leaves it pointing back and down.
        const nozzle = { x: -w * 0.3, y: h * 0.14 };
        const flameAngle = 0.72;
        // Flame tip in local frame, then rotate by the lean to find where to place Joe so the tip lands on (x, y).
        const tipLocal = { x: nozzle.x - Math.sin(flameAngle) * fh, y: nozzle.y + Math.cos(flameAngle) * fh };
        const cosL = Math.cos(LEAN), sinL = Math.sin(LEAN);
        const tipWorld = { x: tipLocal.x * cosL - tipLocal.y * sinL, y: tipLocal.x * sinL + tipLocal.y * cosL };
        const cx = x - tipWorld.x;
        const cy = y - tipWorld.y + bob;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(LEAN);
        if (frames.length && flame.complete) {
          const frame = frames[Math.floor(now / 45) % frames.length];
          const fw = fh * frame.sw / flame.naturalHeight;
          ctx.save();
          ctx.translate(nozzle.x, nozzle.y);
          // Sprite is drawn base-first: the wide bright end sits on the nozzle, the curl trails away.
          ctx.rotate(flameAngle);
          ctx.globalAlpha = 0.95;
          ctx.drawImage(flame, frame.sx, 0, frame.sw, flame.naturalHeight, -fw / 2, 0, fw, fh);
          ctx.restore();
        }
        ctx.drawImage(joe, -w / 2, -h / 2, w, h);
        ctx.restore();
      }

      function frame(now) {
        if (!W) resize();
        ctx.clearRect(0, 0, W, H);
        if (sim.state === "flying") {
          // Extrapolate from the last sample so the number keeps moving between polls.
          const since = (now - sim.sampleAt) / 1000;
          const target = sim.server * Math.exp(sim.k * Math.min(since, 2.5));
          sim.coef += (target - sim.coef) * 0.18;
          const t = (now - sim.flightStart) / 1000;
          const p = 1 - Math.exp(-t / 1.9);
          const pt = pathPoint(p);
          drawStars(now, 1 + p * 3);
          drawClouds(1 + p * 2.5);
          drawCurve(p);
          drawJoe(pt.x, pt.y, now, 1);
          setPhase("flying", sim.coef.toFixed(2), null);
        } else if (sim.state === "crashed") {
          const dt = (now - sim.crashedAt) / 1000;
          const pt = pathPoint(1);
          drawStars(now, 0);
          drawClouds(0.4);
          drawCurve(1);
          if (dt < 0.9) {
            const k = dt / 0.9;
            drawJoe(pt.x + k * k * W * 0.9, pt.y - k * k * H * 1.1, now, 1.4);
          }
          setPhase("crashed", sim.stop.toFixed(2), "Flew away");
        } else if (sim.state === "waiting") {
          drawStars(now, 0.3);
          drawClouds(0.3);
          setWaitBar((sim.waitEndsAt - now) / sim.waitTotal);
          setPhase("waiting", null, null);
        } else {
          drawStars(now, 0.6);
          drawClouds(0.5);
          setPhase(sim.state === "loading" ? "loading" : "idle", "--", "Feed unavailable");
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", function () { W = 0; });
      requestAnimationFrame(frame);

      return {
        // snapshot: { id, coef (number|null), stop (number|null),
        //             phase, changedAt, nextAt, serverNow (ms epoch|null) }
        update: function (snapshot) {
          const now = performance.now();
          loaderEl.classList.add("hide");
          const newRound = snapshot.id != null && snapshot.id !== sim.id;
          if (newRound) sim.id = snapshot.id;

          if (snapshot.stop != null) {
            if (sim.state !== "crashed" || newRound) {
              sim.state = "crashed";
              sim.crashedAt = now;
              sim.stop = Number(snapshot.stop);
              sim.coef = sim.stop;
            }
            return;
          }

          if (snapshot.coef != null) {
            const value = Number(snapshot.coef);
            if (sim.state !== "flying" || newRound) {
              sim.state = "flying";
              sim.coef = value;
              sim.server = value;
              sim.sampleAt = now;
              // If we join mid-flight, back-date the start so the curve is already partly drawn.
              sim.flightStart = now - (Math.log(Math.max(value, 1.001)) / sim.k) * 1000;
              sim.stop = null;
              return;
            }
            const dt = (now - sim.sampleAt) / 1000;
            if (dt > 0.3 && value > sim.server) {
              const observed = Math.log(value / sim.server) / dt;
              if (isFinite(observed) && observed > 0.01 && observed < 0.6) sim.k = sim.k * 0.7 + observed * 0.3;
            }
            sim.server = value;
            sim.sampleAt = now;
            if (sim.coef > value * 1.02) sim.coef = value;
            return;
          }

          if (sim.state !== "waiting") {
            sim.state = "waiting";
            sim.waitingSince = now;
            sim.waitEndsAt = now + WAIT_MS;
            sim.waitTotal = WAIT_MS;
            lastBar = -1;
          }
          // Server clock: the "betting" state counts down to nextStateTime. The 1 s "waiting"
          // state that follows keeps the bar empty until take-off.
          if (snapshot.phase === "betting" && snapshot.nextAt && snapshot.changedAt && snapshot.serverNow) {
            sim.waitTotal = Math.max(1000, snapshot.nextAt - snapshot.changedAt);
            sim.waitEndsAt = now + Math.max(0, snapshot.nextAt - snapshot.serverNow);
          } else if (snapshot.phase === "waiting") {
            sim.waitEndsAt = Math.min(sim.waitEndsAt, now);
          }
        },
        idle: function () {
          if (sim.state === "flying" || sim.state === "crashed") return;
          sim.state = "idle";
          loaderEl.classList.add("hide");
        }
      };
    })();
  </script>

  <script>
    (function () {

      const CUSTOMER_ID = "077dee8d-c923-4c02-9bee-757573662e69";
      const historyBar = document.getElementById("historyBar");
      let rounds = [];

      function band(coef) {
        if (coef >= 10) return "high";

      }

      function money(coef) {

      }

      function parseRounds(data) {
        if (window.CrashEngine && CrashEngine.normalizeHistoryResponse) {
          const norm = CrashEngine.normalizeHistoryResponse(data);
          if (norm && norm.status === "ok" && norm.rounds && norm.rounds.length) {
            return norm.rounds.map(function (round) {

            coef = Number(item.topCoefficient ?? first ?? item.coef ?? item.coefficient ?? item.multiplier ?? item.crash);
          }

        }).filter(function (round) { return isFinite(round.coef) && round.coef > 0; });
      }

      const FADE = [1, 1, 0.62, 0.4, 0.3];
      function renderHistory() {
        historyBar.innerHTML = "";
        const now = document.createElement("button");
        now.className = "pill now";
        now.type = "button";

        if (!rounds.length) {
          const empty = document.createElement("button");
          empty.className = "pill empty";
          empty.type = "button";
          empty.textContent = "--";
          historyBar.appendChild(empty);
          return;
        }
        rounds.slice(0, 24).forEach(function (round, index) {
          const pill = document.createElement("button");

          pill.className = "pill " + band(round.coef);
          pill.textContent = money(round.coef);
          pill.style.opacity = FADE[Math.min(index, FADE.length - 1)];

      async function fetchHistory() {
        try {
          const res = await fetch(HISTORY_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          const data = await res.json();
          const next = parseRounds(data);
          if (!next.length) return;
          if (!rounds.length) {
            rounds = next.slice(0, 500);
            lastSeenId = rounds[0] && rounds[0].id;
            renderHistory();
            return;
          }
          if (next[0] && next[0].id != null && next[0].id === lastSeenId) return;
          const seen = {};
          rounds.forEach(function (round) { if (round.id != null) seen[round.id] = true; });
          const fresh = next.filter(function (round) { return round.id == null || !seen[round.id]; });
          rounds = fresh.concat(rounds).slice(0, 500);
          lastSeenId = rounds[0] && rounds[0].id;
          renderHistory();
        } catch (error) { /* strip keeps its last contents */ }
      }

      // Live round state. Polled fast so the coefficient tracks the real flight.
      let stateFailures = 0;
      let lastStopId = null;
      async function fetchState() {
        try {
          const res = await fetch(STATE_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          if (!res.ok) throw new Error("state " + res.status);

          const current = Array.isArray(data.currentCoefficients) ? data.currentCoefficients[0] : null;
          const stop = Array.isArray(data.stopCoefficients) ? data.stopCoefficients[0] : null;
          const id = data.roundConfig && data.roundConfig.id != null ? data.roundConfig.id : null;
          const ms = function (value) { const t = Date.parse(value); return isFinite(t) ? t : null; };
          stateFailures = 0;
          Flight.update({
            id: id, coef: current, stop: stop,
            phase: data.currentState || null,
            changedAt: ms(data.stateChangedAt),
            nextAt: ms(data.nextStateTime),
            serverNow: ms(data.currentTime)
          });

          // When a round ends, drop it straight into the strip without waiting for history.
          if (stop != null && id != null && id !== lastStopId) {
            lastStopId = id;
            const known = rounds.some(function (round) { return round.id === id; });
            if (!known) {
              rounds = [{ id: id, coef: Number(stop) }].concat(rounds).slice(0, 500);
              lastSeenId = id;
              renderHistory();
            }
          }
        } catch (error) {
          stateFailures++;
          if (stateFailures >= 4) Flight.idle();
        }
      }

      const sheet = document.getElementById("sheet");
      document.getElementById("infoBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("clockBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("sheetClose").addEventListener("click", function () {
        sheet.classList.remove("show");
      });
      sheet.addEventListener("click", function (event) {
        if (event.target === sheet) sheet.classList.remove("show");
      });

      fetchHistory();
      setInterval(fetchHistory, 5000);
      fetchState();
      setInterval(fetchState, 600);
    })();

  <script>
    let signalActive = false, nextSignalTime = null, secondSignalTime = null, countdownInterval = null, predictionData = null, verificationInterval = null, verificationTimeout = null;

    function getUserTimeZone() {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const map = { "Asia/Calcutta": "Asia/Kolkata", "US/Eastern": "America/New_York", "US/Central": "America/Chicago", "US/Mountain": "America/Denver", "US/Pacific": "America/Los_Angeles", "Europe/Kiev": "Europe/Kyiv" };
      return map[tz] || tz;
    }
    function getUTCOffset() {
      const off = -new Date().getTimezoneOffset();
      const sign = off >= 0 ? "+" : "-";
      const h = String(Math.floor(Math.abs(off) / 60)).padStart(2, "0");
      const m = String(Math.abs(off) % 60).padStart(2, "0");
      return sign + h + ":" + m;
    }
    function parseTimeWindow(timeStr) {
      if (!timeStr || timeStr === "--:--") return null;
      const parts = timeStr.split(":");
      if (parts.length < 2) return null;
      const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
      if (isNaN(h) || isNaN(m)) return null;
      const now = new Date(), target = new Date(now);
      target.setHours(h, m, 0, 0);
      if (target.getTime() < now.getTime() - 2 * 60 * 1000) target.setDate(target.getDate() + 1);
      return target;
    }
    function generateCoefficients() {
      const r = Math.random();
      let left;
      if (r < 0.60) left = rand(2.21, 4.10);
      else if (r < 0.85) left = rand(3.51, 8.00);
      else left = rand(8.00, 10.00);
      const right = left + rand(0.20, 0.60);
      return { leftCoeff: left.toFixed(2), rightCoeff: right.toFixed(2) };
    }
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randomChance() { return Math.floor(Math.random() * 6) + 94; }

    const apiURL = "https://crash-gateway-grm-cr.gamedev-tech.cc/history";
    const apiHeaders = { "customer-id": "077dee8d-c923-4c02-9bee-757573662e69", "session-id": "299414bc54520564d91a381082d5e3c6442ad45ece6eaeb402bce0c7e46b4806538807964fb1b60154543333408d84032654af9234b2e78daa6bee258f212677160e35288ba0750f10b39e677b3469c046cbac6190fff1b30d51fb67d9ce70a60c116f6d2bea5b5f6b9e10b81cacacb15f14331973b3370fba551bf5f2c83a6166cc1ffa94bd70c108be3e88301d93cfa5c7af381e5c1342fc3c522b27eb6b4ecf6f95906127e898f9130805.ba36c97750e47ddf2487a16b550970dc.077dee8d-c923-4c02-9bee-757573662e69", "accept": "application/json" };
    async function fetchGameData() {
      try {
        const res = await fetch(apiURL, { headers: apiHeaders });
        if (!res.ok) throw new Error("API error");
        const data = await res.json();
        const raw = Array.isArray(data) ? data : (data && (data.rounds || data.history || data.items || data.data)) || [];
        return Array.isArray(raw) ? raw : [];
      } catch (e) {
        return [];
      }
    }

    function startPredictionVerification() {
      if (!predictionData || !nextSignalTime) return;
      const check = async function () {
        const now = new Date();
        const w1Start = nextSignalTime, w1End = new Date(nextSignalTime.getTime() + 60000);
        const w2Start = secondSignalTime, w2End = new Date(secondSignalTime.getTime() + 60000);
        const inWindow = (now >= w1Start && now <= w1End) || (now >= w2Start && now <= w2End);
        if (inWindow) {
          const data = await fetchGameData();
          if (data && data.length) {
            const latest = data[0];
            const first = Array.isArray(latest.finalValues) ? latest.finalValues[0] : undefined;
            const coeff = parseFloat(latest.topCoefficient ?? first ?? latest.coefficient ?? latest.multiplier ?? latest.coef ?? 0);
            if (coeff > 0) {
              clearInterval(verificationInterval); verificationInterval = null;
              const left = parseFloat(predictionData.leftCoeff), right = parseFloat(predictionData.rightCoeff);
              const hit = coeff >= left && coeff <= right;
              const label = now >= w1Start && now <= w1End ? "(1st window)" : "(2nd window)";
              displayVerificationResult(hit, coeff, label);
            }
          }
        }
        if (now > w2End) { clearInterval(verificationInterval); verificationInterval = null; }
      };
      verificationInterval = setInterval(check, 5000);
      setTimeout(function () { if (verificationInterval) { clearInterval(verificationInterval); verificationInterval = null; } }, 6 * 60000);
    }
    function displayVerificationResult(hit, coeff, label) {
      const btn = document.getElementById("newSignalBtn");

      btn.classList.remove("hit", "miss");

      verificationTimeout = setTimeout(function () {
        btn.classList.remove("hit", "miss");
        valEl.textContent = saved;
      }, 10000);
    }

    function startCountdown() {

      const btn = document.getElementById("newSignalBtn"), status = document.getElementById("statusDisplay");
      const label = btn.querySelector(".place-label");
      countdownInterval = setInterval(function () {
        const now = new Date(), timeLeft = expiresAt - now;
        if (timeLeft <= 0) { clearInterval(countdownInterval); resetUI(); return; }
        const toTarget = nextSignalTime - now;
        if (toTarget > 0) {
          const m = Math.floor(toTarget / 60000), s = Math.floor((toTarget % 60000) / 1000);
          label.textContent = "SIGNAL IN " + m + ":" + s.toString().padStart(2, "0");
          status.textContent = "Waiting for window...";

        } else {

          label.textContent = "EXPIRES IN " + m + ":" + s.toString().padStart(2, "0");
          status.textContent = "Signal active";
          status.className = "status pulsing";
        }
      }, 1000);
    }

    function resetUI() {
      signalActive = false; nextSignalTime = null; secondSignalTime = null; predictionData = null;
      if (verificationInterval) { clearInterval(verificationInterval); verificationInterval = null; }
      if (verificationTimeout) { clearTimeout(verificationTimeout); verificationTimeout = null; }
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      const btn = document.getElementById("newSignalBtn");
      btn.disabled = false;
      btn.classList.remove("has-value", "hit", "miss");
      btn.querySelector(".place-label").textContent = "GET SIGNAL";
      document.getElementById("coeffValue").textContent = "";
      document.getElementById("statusDisplay").textContent = "";
      document.getElementById("statusDisplay").className = "status";
      document.getElementById("chanceDisplay").textContent = "00%";
      document.getElementById("progressFill").style.width = "0%";
      document.getElementById("apiTimeWindow").textContent = "--:--";

    async function generateNewSignal() {
      if (signalActive) return;
      const btn = document.getElementById("newSignalBtn"), status = document.getElementById("statusDisplay");
      const label = btn.querySelector(".place-label");

      status.className = "status pulsing";
      btn.disabled = true;
      label.textContent = "ANALYSING...";
      let prediction = null, targetTime = null;
      try {
        const tz = getUserTimeZone(), offset = getUTCOffset();
        const res = await fetch("https://trd.cc.nf/bot.php?t=" + encodeURIComponent(tz) + "&offset=" + offset);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const apiData = await res.json();
        const twStr = apiData && apiData.time_window;
        const leftRaw = parseFloat(apiData && apiData.manual_prediction && apiData.manual_prediction.coeff);
        const rightRaw = parseFloat(apiData && apiData.ai_prediction);
        targetTime = parseTimeWindow(twStr);
        if (!isNaN(leftRaw) && !isNaN(rightRaw) && leftRaw > 0 && rightRaw > leftRaw) {
          prediction = { leftCoeff: leftRaw.toFixed(2), rightCoeff: rightRaw.toFixed(2), chance: randomChance(), source: "api" };
        } else if (!isNaN(leftRaw) && leftRaw > 0) {
          const spread = rand(0.20, 0.55);
          prediction = { leftCoeff: leftRaw.toFixed(2), rightCoeff: (leftRaw + spread).toFixed(2), chance: randomChance(), source: "api-partial" };
        } else { throw new Error("No valid coeff"); }
        if (twStr) document.getElementById("apiTimeWindow").textContent = twStr;
      } catch (err) {
        prediction = Object.assign(generateCoefficients(), { chance: randomChance(), source: "local" });
      }
      await new Promise(function (r) { setTimeout(r, 1500); });
      const now = new Date();
      if (targetTime) {
        nextSignalTime = targetTime;
        if (nextSignalTime.getTime() <= now.getTime() + 5000) nextSignalTime = new Date(now.getTime() + 30000);
      } else {
        nextSignalTime = new Date(now.getTime() + Math.floor(rand(90, 210)) * 1000);
      }
      secondSignalTime = new Date(nextSignalTime.getTime() + 60000);
      signalActive = true;
      predictionData = { leftCoeff: prediction.leftCoeff, rightCoeff: prediction.rightCoeff, chance: prediction.chance, generatedAt: new Date() };
      if (!targetTime) {
        document.getElementById("apiTimeWindow").textContent = nextSignalTime.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", hour12: false });
      }
      btn.classList.add("has-value");
      document.getElementById("coeffValue").innerHTML = "<small>x</small>" + prediction.leftCoeff + " – " + prediction.rightCoeff;
      document.getElementById("chanceDisplay").textContent = prediction.chance + "%";
      document.getElementById("progressFill").style.width = prediction.chance + "%";
      status.textContent = "Window " + document.getElementById("apiTimeWindow").textContent;
      status.className = "status pulsing";
      startCountdown();
      startPredictionVerification();
    }

    document.getElementById("newSignalBtn").addEventListener("click", generateNewSignal);
    document.addEventListener("DOMContentLoaded", function () { resetUI(); });
  </script>
