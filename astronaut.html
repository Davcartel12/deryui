<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astronaut Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--c:#00aaff;--c2:#0088cc;--c3:#88ddff;--bg:#00050f}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;background:var(--bg);color:#fff;font-family:'Orbitron',sans-serif;overflow:hidden}
    .bg-layer{position:fixed;inset:0;z-index:0;background:url("https://i.supaimg.com/9b17bf36-e51c-4f7b-83ce-62e7049d6f76.avif") center/cover no-repeat;opacity:.15}
    /* Stars */
    .stars{position:fixed;inset:0;z-index:0;background:radial-gradient(1px 1px at 20% 30%,rgba(136,221,255,.6),transparent),radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 40% 70%,rgba(136,221,255,.5),transparent),radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 10% 90%,rgba(136,221,255,.4),transparent),radial-gradient(1px 1px at 60% 40%,rgba(255,255,255,.5),transparent)}
    #pg-loader{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .loader-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;letter-spacing:8px;color:var(--c);text-shadow:0 0 40px var(--c)}
    .loader-sub{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,.4);text-transform:uppercase}
    .loader-track{width:240px;height:2px;background:rgba(0,170,255,.1);border-radius:99px;overflow:hidden}
    #pg-bar{height:100%;width:1%;background:linear-gradient(90deg,var(--c),var(--c3));border-radius:99px;transition:width .06s linear;box-shadow:0 0 12px var(--c)}
    #pg-pct{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:3px}
    .page{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:12px 16px}

    /* TOP HUD */
    .mission-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(0,170,255,.2);margin-bottom:10px}
    .mission-brand{font-size:16px;font-weight:900;letter-spacing:4px;color:var(--c);text-shadow:0 0 20px var(--c)}
    .mission-status{text-align:right}
    .ms-label{font-size:7px;letter-spacing:3px;color:rgba(0,170,255,.4);margin-bottom:2px}
    .ms-value{font-size:10px;letter-spacing:2px;color:rgba(0,170,255,.8);display:flex;align-items:center;gap:5px;justify-content:flex-end}
    .ms-dot{width:5px;height:5px;border-radius:50%;background:#00aaff;box-shadow:0 0 6px #00aaff;animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* HISTORY */
    .hist-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .hist-lbl{font-size:8px;letter-spacing:3px;color:rgba(0,170,255,.4);white-space:nowrap}
    .history-bar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1}
    .history-bar::-webkit-scrollbar{display:none}
    .history-pill{flex-shrink:0;padding:3px 9px;border-radius:3px;background:rgba(0,170,255,.08);border:1px solid rgba(0,170,255,.3);color:#0088cc;font-family:'Orbitron',sans-serif;font-size:10px;animation:pill-in .3s ease}
    @keyframes pill-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    .history-pill.high{color:var(--c3);border-color:rgba(136,221,255,.4);background:rgba(136,221,255,.1)}
    .history-pill.low{color:#ff6060;border-color:rgba(255,60,60,.3)}

    /* MAIN AREA */
    .hud-main{flex:1;display:flex;flex-direction:column;gap:10px}

    /* ORBIT DISPLAY */
    .orbit-section{display:flex;align-items:center;justify-content:center;gap:20px}
    .orbit-wrap{position:relative;width:min(180px,45vw);height:min(180px,45vw);flex-shrink:0}
    .orbit-canvas{position:absolute;inset:0;width:100%;height:100%}
    .orbit-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
    .orbit-label{font-size:7px;letter-spacing:3px;color:rgba(0,170,255,.5)}
    #predictionValue{font-family:'Inter',sans-serif;font-size:46px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 30px var(--c),0 0 60px rgba(0,170,255,.3);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
    #predictionValue.pop{transform:scale(1.12);text-shadow:0 0 60px var(--c3),0 0 20px var(--c3)}
    .orbit-sub{font-size:7px;letter-spacing:2px;color:rgba(0,170,255,.4)}

    /* SIDE PANELS */
    .side-panels{display:flex;flex-direction:column;gap:8px;flex:1}
    .side-panel{background:rgba(0,170,255,.04);border:1px solid rgba(0,170,255,.2);border-radius:6px;padding:10px;position:relative;overflow:hidden}
    .side-panel::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--c)}
    .sp-label{font-size:7px;letter-spacing:3px;color:rgba(0,170,255,.5);margin-bottom:4px}
    .sp-value{font-size:18px;font-weight:700;color:var(--c)}
    .sp-sub{font-size:7px;letter-spacing:2px;color:rgba(0,170,255,.3);margin-top:2px}

    /* BOTTOM PANELS */
    .bottom-panels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .bottom-panel{background:rgba(0,170,255,.04);border:1px solid rgba(0,170,255,.15);border-radius:5px;padding:8px;text-align:center}
    .bp-val{font-size:14px;font-weight:700;color:var(--c)}
    .bp-lbl{font-size:7px;letter-spacing:2px;color:rgba(0,170,255,.4);margin-top:2px}

    /* SIGNAL */
    .sig-row{display:flex;align-items:center;gap:6px;justify-content:center;margin:4px 0}
    .sig-dot{width:6px;height:6px;border-radius:50%;background:#2dff7e;box-shadow:0 0 8px #2dff7e;animation:blink 1.2s infinite}
    .sig-txt{font-size:7px;letter-spacing:3px;color:#2dff7e;text-transform:uppercase}

    /* FOOTER */
    .mission-footer{border-top:1px solid rgba(0,170,255,.15);padding-top:10px;display:flex;justify-content:center}
    .exit-btn{padding:9px 40px;border-radius:4px;background:transparent;border:1px solid rgba(0,170,255,.4);color:var(--c);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:3px;cursor:pointer;transition:.25s}
    .exit-btn:hover{background:rgba(0,170,255,.1);box-shadow:0 0 20px rgba(0,170,255,.3)}
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="stars"></div>
  <div id="pg-loader">
    <div class="loader-title">ASTRONAUT</div>
    <div class="loader-sub">Initializing Mission Control…</div>
    <div class="loader-track"><div id="pg-bar"></div></div>
    <div id="pg-pct">1%</div>
  </div>
  <script>
    (function(){var dur=5000+Math.random()*5000,p=1,b=document.getElementById('pg-bar'),t=document.getElementById('pg-pct'),o=document.getElementById('pg-loader');var iv=setInterval(function(){p+=Math.floor(Math.random()*4)+1;if(p>=100){p=100;clearInterval(iv);setTimeout(function(){o.style.transition='opacity 0.6s';o.style.opacity='0';setTimeout(function(){o.remove();},650);},200);}b.style.width=p+'%';t.textContent=p+'%';},Math.round(dur/40));})();
  </script>
  <div class="page">
    <div class="mission-bar">
      <div class="mission-brand">ASTRONAUT</div>
      <div class="mission-status">
        <div class="ms-label">MISSION STATUS</div>
        <div class="ms-value"><div class="ms-dot"></div>ONLINE</div>
      </div>
    </div>
    <div class="hist-row">
      <div class="hist-lbl">TELEMETRY</div>
      <div class="history-bar" id="historyBar"></div>
    </div>
    <div class="hud-main">
      <div class="orbit-section">
        <div class="orbit-wrap" id="orbitWrap">
          <canvas class="orbit-canvas" id="orbitCanvas"></canvas>
          <div class="orbit-center">
            <div class="orbit-label">TARGET</div>
            <div id="predictionValue">--</div>
            <div class="orbit-sub">COEFFICIENT</div>
          </div>
        </div>
        <div class="side-panels">
          <div class="side-panel">
            <div class="sp-label">AI ENGINE</div>
            <div class="sp-value">ACTIVE</div>
            <div class="sp-sub">ENSEMBLE MODE</div>
          </div>
          <div class="side-panel">
            <div class="sp-label">LIVE FEED</div>
            <div class="sp-value" style="color:#2dff7e">ONLINE</div>
            <div class="sp-sub">REAL-TIME DATA</div>
          </div>
          <div class="side-panel">
            <div class="sp-label">MODELS LOADED</div>
            <div class="sp-value">7</div>
            <div class="sp-sub">PREDICTION UNITS</div>
          </div>
        </div>
      </div>
      <div class="bottom-panels">
        <div class="bottom-panel"><div class="bp-val">EWMA</div><div class="bp-lbl">Model 1</div></div>
        <div class="bottom-panel"><div class="bp-val" style="color:#2dff7e">LIVE</div><div class="bp-lbl">Feed</div></div>
        <div class="bottom-panel"><div class="bp-val">REG</div><div class="bp-lbl">Model 2</div></div>
      </div>
      <div class="sig-row">
        <div class="sig-dot"></div>
        <div class="sig-txt">SIGNAL LOCKED — NEXT COEFFICIENT</div>
      </div>
    </div>
    <div class="mission-footer">
      <button class="exit-btn" onclick="location.href='login.html'">EXIT MISSION</button>
    </div>
  </div>
  <script>
    // Orbit animation
    (function(){
      const canvas=document.getElementById('orbitCanvas');
      const wrap=document.getElementById('orbitWrap');
      function resize(){canvas.width=wrap.offsetWidth;canvas.height=wrap.offsetHeight;}
      resize();window.addEventListener('resize',resize);
      const ctx=canvas.getContext('2d');
      let a1=0,a2=2,a3=4;
      function draw(){
        const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
        ctx.clearRect(0,0,w,h);
        // rings
        [[cx*0.85,0.3],[cx*0.65,0.2],[cx*0.45,0.15]].forEach(([r,op])=>{
          ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
          ctx.strokeStyle=`rgba(0,170,255,${op})`;ctx.lineWidth=1;ctx.stroke();
        });
        // center glow
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,cx*0.3);
        grd.addColorStop(0,'rgba(0,170,255,0.15)');grd.addColorStop(1,'rgba(0,170,255,0)');
        ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,cx*0.3,0,Math.PI*2);ctx.fill();
        // orbiting dots
        [[a1,cx*0.85,'rgba(0,170,255,0.9)',3],[a2,cx*0.65,'rgba(136,221,255,0.8)',2],[a3,cx*0.45,'rgba(0,170,255,0.6)',2]].forEach(([a,r,color,size])=>{
          const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
          ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);
          ctx.fillStyle=color;ctx.fill();
          ctx.beginPath();ctx.arc(x,y,size+4,0,Math.PI*2);
          ctx.fillStyle=color.replace(/[\d.]+\)$/,'0.2)');ctx.fill();
        });
        a1+=0.025;a2-=0.018;a3+=0.04;
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
  <script type="module">
    import { get as _get } from "https://cdn.jsdelivr.net/npm/lodash-es@4.17.21/lodash.min.js";
    const HISTORY_URL="https://crash-gateway-grm-cr.100hp.app/history";
    const SESSION_ID="7baa0c3f-79e4-4c16-93fa-1e1d8407086e";
    const CUSTOMER_ID="077dee8d-c923-4c02-9bee-757573662e69";
    const historyBar=document.getElementById("historyBar");
    const predEl=document.getElementById("predictionValue");
    let lastSeenId=null;
    const historyData=[];
    function getCoef(item){const v=_get(item,"coef")??_get(item,"crash")??_get(item,"value")??_get(item,"topCoefficient");return v?Number(v):undefined;}
    function renderHistory(){historyBar.innerHTML="";historyData.slice(-18).reverse().forEach(c=>{const pill=document.createElement("div");pill.className="history-pill"+(c>=5?" high":c<1.5?" low":"");pill.innerText=c.toFixed(2)+"x";historyBar.appendChild(pill);});}
    function calculateMovingAverage(data,window){if(data.length<window)return data[data.length-1]||1.5;const s=data.slice(-window);return s.reduce((a,b)=>a+b,0)/s.length;}
    function calculateEWMA(data,alpha=0.3){if(!data.length)return 1.5;let e=data[0];for(let i=1;i<data.length;i++)e=alpha*data[i]+(1-alpha)*e;return e;}
    function calculateVolatility(data){if(data.length<2)return 0;const mean=data.reduce((a,b)=>a+b,0)/data.length;const v=data.reduce((s,v)=>s+Math.pow(v-mean,2),0)/data.length;return Math.sqrt(v);}
    function detectTrend(data,window=10){if(data.length<window)return 0;const r=data.slice(-window);let inc=0;for(let i=1;i<r.length;i++)if(r[i]>r[i-1])inc++;return(inc/(r.length-1))-0.5;}
    function calculateMomentum(data,period=5){if(data.length<period+1)return 0;const cur=data[data.length-1],past=data[data.length-period-1];return(cur-past)/past;}
    function findCycles(data){if(data.length<20)return 1.5;const norm=data.map(v=>Math.log(v));const mean=norm.reduce((a,b)=>a+b,0)/norm.length;const centered=norm.map(v=>v-mean);let maxCorr=0,bestLag=1;for(let lag=1;lag<Math.min(10,data.length/2);lag++){let corr=0;for(let i=0;i<centered.length-lag;i++)corr+=centered[i]*centered[i+lag];corr/=(centered.length-lag);if(Math.abs(corr)>Math.abs(maxCorr)){maxCorr=corr;bestLag=lag;}}return data.length>bestLag?data[data.length-bestLag]:data[data.length-1];}
    function weightedRegression(data,weights){if(data.length<3)return data[data.length-1]||1.5;const n=data.length;let sx=0,sy=0,sxy=0,sx2=0,sw=0;for(let i=0;i<n;i++){const x=i,y=Math.log(data[i]),w=weights[i];sw+=w;sx+=w*x;sy+=w*y;sxy+=w*x*y;sx2+=w*x*x;}const slope=(sw*sxy-sx*sy)/(sw*sx2-sx*sx);const intercept=(sy-slope*sx)/sw;return Math.exp(slope*n+intercept);}
    function ensemblePrediction(history){if(history.length<10)return 1.2+Math.random()*1.5;const vol=calculateVolatility(history.slice(-20));const alpha=Math.max(0.1,Math.min(0.5,vol/2));const ewmaPred=calculateEWMA(history,alpha);const weights=history.map((_,i)=>Math.exp((i-history.length)/10));const wmaPred=calculateMovingAverage(history.map((v,i)=>v*weights[i]),Math.min(15,history.length))/calculateMovingAverage(weights,Math.min(15,history.length));const trend=detectTrend(history,15);const recentAvg=calculateMovingAverage(history,10);const trendPred=recentAvg*(1+trend*0.2);const momentum=calculateMomentum(history,7);const momentumPred=history[history.length-1]*(1+momentum*0.3);const cyclePred=findCycles(history);const regWeights=history.map((_,i)=>Math.exp((i-history.length+1)/8));const regressionPred=weightedRegression(history,regWeights);const overallMean=history.reduce((a,b)=>a+b,0)/history.length;const lastValue=history[history.length-1];const meanReversionPred=lastValue+(overallMean-lastValue)*0.3;const preds=[{val:ewmaPred,weight:.25},{val:wmaPred,weight:.20},{val:trendPred,weight:.15},{val:momentumPred,weight:.10},{val:cyclePred,weight:.10},{val:regressionPred,weight:.15},{val:meanReversionPred,weight:.05}];let v=preds.reduce((s,p)=>s+p.val*p.weight,0);return Math.max(1.01,Math.min(v,50));}
    async function fetchHistory(){try{const res=await fetch(HISTORY_URL,{headers:{accept:"application/json","session-id":SESSION_ID,"customer-id":CUSTOMER_ID}});const data=await res.json();if(!Array.isArray(data)||!data.length)return;const latest=data[0];if(latest?.id===lastSeenId)return;lastSeenId=latest.id;const coef=getCoef(latest);if(!coef)return;historyData.push(coef);renderHistory();const next=ensemblePrediction(historyData);predEl.textContent=next.toFixed(2)+"x";predEl.classList.remove("pop");void predEl.offsetWidth;predEl.classList.add("pop");setTimeout(()=>predEl.classList.remove("pop"),500);}catch(e){console.error(e);}}
    fetchHistory();
    setInterval(fetchHistory,5000);
  </script>
</body>
</html>
