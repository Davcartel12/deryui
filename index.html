<!doctype html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>Access code - CHIKE1W</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/access-core.js"></script>
  <script>
    // Already activated on this device: go straight in.
    (function () {
      var s = AccessCodes.readSession();
      if (s && s.code && (s.expiresAt == null || Date.now() < s.expiresAt) && location.search.indexOf("reason=") < 0) {
        location.replace("login.html");
      }
    })();
  </script>
  <style>
    :root {
      --bg: #090d16;
      --header: #0c1220;
      --line: rgba(255, 255, 255, 0.08);
      --blue: #1a73ff;
      --green: #00a84f;
      --red: #ff5a5f;
      --text: #ffffff;
      --muted: #8d97ab;
      --card: #151b2b;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
    }

    button,
    input {
      font-family: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }

    .topbar img {
      height: 38px;
      width: auto;
      max-width: 150px;
      object-fit: contain;
      display: block;
      mix-blend-mode: screen;
    }

    .shell {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px 18px 20px;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: rgba(26, 115, 255, 0.14);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 26px;
      height: 26px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .sub {
      margin-top: 6px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .code-input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0f1424;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .code-input::placeholder {
      color: rgba(141, 151, 171, 0.5);
      letter-spacing: 2px;
      font-size: 15px;
      font-weight: 700;
    }

    .code-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 115, 255, 0.2);
    }

    .code-input.bad {
      border-color: var(--red);
      animation: shake 0.3s;
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .activate {
      width: 100%;
      height: 50px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
    }

    .activate:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .msg {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
    }

    .help {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .help a {
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }

    .success {
      display: none;
      text-align: center;
    }

    .card.done .form {
      display: none;
    }

    .card.done .success {
      display: block;
    }

    .success .icon {
      background: rgba(0, 168, 79, 0.16);
      color: var(--green);
    }

    .success .until {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #0f1424;
      font-size: 13px;
      color: var(--muted);
    }

    .success .until b {
      display: block;
      margin-top: 3px;
      color: #fff;
      font-size: 15px;
    }

    .bar {
      margin-top: 18px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .bar i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--blue), #6aa6ff);
    }

    .card.done .bar i {
      animation: bar-fill 1.6s cubic-bezier(0.25, 0.6, 0.35, 1) forwards;
    }

    @keyframes bar-fill {
      0% { width: 0; }
      55% { width: 62%; }
      80% { width: 86%; }
      100% { width: 100%; }
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <img src="brand-logo.png" alt="CHIKE1W">
  </header>

  <main class="shell">
    <section class="card" id="card">
      <div class="form">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Enter your access code</h1>
        <p class="sub">Your code was given to you by the admin. It unlocks the app for the period attached to it.</p>
        <label for="code">Access code</label>
        <input class="code-input" id="code" type="text" placeholder="XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="24">
        <button class="activate" id="activate" type="button">Activate</button>
        <div class="msg" id="msg"></div>
        <div class="help">Do not have a code? <a href="https://t.me/Chikeprono" target="_blank" rel="noopener">Message the admin</a></div>
      </div>
      <div class="success">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <h1>Code activated</h1>
        <div class="until">Access valid until<b id="until"></b></div>
        <div class="bar"><i></i></div>
        <div class="hint">Opening</div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var A = window.AccessCodes;
      var input = document.getElementById("code");
      var button = document.getElementById("activate");
      var msg = document.getElementById("msg");
      var card = document.getElementById("card");

      var REASONS = {
        expired: "Your access has expired. Enter a new code to continue.",
        revoked: "Your code was deactivated by the admin.",
        device: "This code is in use on another device.",
        invalid: "Your code is no longer valid. Enter a new one."
      };
      var ERRORS = {
        invalid: "This code does not exist. Check it and try again.",
        revoked: "This code has been deactivated.",
        expired: "This code expired on ",
        device: "This code is already in use on another device.",
        rules: "The server refused the request. Ask the admin to check the access-code setup.",
        network: "Could not reach the server. Check your connection and try again."
      };

      var reason = new URLSearchParams(location.search).get("reason");
      if (reason && REASONS[reason]) msg.textContent = REASONS[reason];

      input.addEventListener("input", function () {
        var v = A.normalizeCode(input.value).replace(/-/g, "");
        if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4, 12);
        input.value = v;
        input.classList.remove("bad");
      });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") activate(); });
      button.addEventListener("click", activate);

      function fail(text) {
        msg.textContent = text;
        input.classList.remove("bad");
        void input.offsetWidth;
        input.classList.add("bad");
        button.disabled = false;
        button.textContent = "Activate";
      }

      async function activate() {
        var code = A.normalizeCode(input.value);
        if (code.length < 4) { fail("Enter the code you received."); return; }
        button.disabled = true;
        button.textContent = "Checking";
        msg.textContent = "";
        var device = A.deviceId();
        try {
          var ctx = await A.firebase();
          var ref = ctx.fs.doc(ctx.db, "accessCodes", code);
          var snap = await ctx.fs.getDoc(ref);
          var result = A.evaluate(snap.exists() ? snap.data() : null, device);
          if (!result.ok) {
            fail(result.reason === "expired" ? ERRORS.expired + A.formatDate(result.expiresAt) + "." : ERRORS[result.reason]);
            return;
          }
          var expiresAt = result.expiresAt;
          if (!result.activated || (result.data.lockDevice !== false && !result.data.deviceId)) {
            // First use: start the clock and remember this device.
            var patch = { deviceId: device };
            if (!result.activated) patch.activatedAt = ctx.fs.serverTimestamp();
            await ctx.fs.updateDoc(ref, patch);
            if (!result.activated) expiresAt = Date.now() + Number(result.data.durationMs);
          }
          A.writeSession({ code: code, deviceId: device, expiresAt: expiresAt, checkedAt: Date.now() });
          document.getElementById("until").textContent = A.formatDate(expiresAt);
          card.classList.add("done");
          setTimeout(function () { location.replace("login.html"); }, 1800);
        } catch (error) {
          var text = String(error && (error.code || error.message) || "");
          fail(/permission|insufficient/i.test(text) ? ERRORS.rules : ERRORS.network);
        }
      }
    })();
  </script>
</body>

</html>
