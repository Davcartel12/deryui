<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - APNAJ</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #1e90ff;
    --bg: #07080c;
    --surface: #0d0f16;
    --border: rgba(255, 255, 255, 0.07);
    --text: #f0f2ff;
    --muted: rgba(240, 242, 255, 0.45);
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  
  body, html { 
    height: 100%; 
    font-family: 'DM Sans', sans-serif; 
  }

  body {
    background: url('https://i.supaimg.com/9d6e18f4-1d1c-4ad2-be6e-032e508dd07f.png') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  
  /* Dark Glass Overlay to dim the background perfectly */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(7, 8, 12, 0.65);
    z-index: 0;
  }

  .login-container {
    position: relative;
    z-index: 1;
    background: rgba(13, 15, 22, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    width: 90%;
    max-width: 380px;
    text-align: center;
    animation: fadeUp 0.6s ease-out;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-container h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 4px;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 400;
  }
  
  .login-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .login-container input {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: 0.3s;
    text-align: center;
    letter-spacing: 2px;
  }

  .login-container input::placeholder {
    color: var(--muted);
    letter-spacing: normal;
  }

  .login-container input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.09);
    box-shadow: 0 0 15px rgba(30, 144, 255, 0.2);
  }

  .login-container button {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 15px;
    font-weight: 800;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 10px;
  }

  .login-container button:hover {
    background: #1a7fe0;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30, 144, 255, 0.3);
  }

  .error {
    color: #ff4f4f;
    margin-top: 15px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: 0.3s;
    height: 20px;
  }
  
  .error.show {
    opacity: 1;
  }
</style>
</head>

<body>
  <div class="login-container">
    <h2>APNAJ</h2>
    <div class="login-sub">Enter password to continue</div>
    
    <div class="input-group">
      <input type="password" id="password" placeholder="Password" />
    </div>
    
    <button onclick="login()">Unlock</button>
    
    <div id="error" class="error">Incorrect password</div>
  </div>

<script>
  function login() {
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (password === "weng123") {
      window.location.href = "loading.html";
    } else {
      error.classList.add("show");
      setTimeout(() => error.classList.remove("show"), 3000);
    }
  }
  
  document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      login();
    }
  });
</script>
</body>
</html>
