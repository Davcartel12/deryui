<!DOCTYPE html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="UTF-8">
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Dice - CHIKE1W</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html { -webkit-text-size-adjust: 100%; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: #000 url("dice/cubes.png") center / 280px repeat;
      color: #fff;
      font-family: Inter, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      min-width: 0;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .pause {
      width: 22px;
      height: auto;
      opacity: 0.85;
    }

    .board {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px 16px 18px;
      text-align: center;
    }

    .roll {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .roll.over { color: #3ddc84; }
    .roll.under { color: #ff5b6e; }

    .target-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #8d97ab;
      font-weight: 700;
    }

    .target-row b { color: #fff; font-size: 16px; }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
      accent-color: #00a84f;
    }

    .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
    }

    .side {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #141418;
      color: #6e7686;
      border-radius: 999px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .side.on-over {
      color: #04140a;
      background: #3ddc84;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .side.on-under {
      color: #fff;
      background: #ff5b6e;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .signal-btn,
    .reset-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .signal-btn {
      margin-top: 12px;
      padding: 15px;
      background: #00a84f;
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.4px;
    }

    .signal-btn:disabled {
      background: #1a1d24;
      color: #5b6478;
      cursor: not-allowed;
    }

    .reset-btn {
      margin-top: 8px;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8d97ab;
      font-size: 13px;
    }

    .note {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #8d97ab;
      font-weight: 700;
    }
  </style>
</head>

<body class="theme-noise">
  <header class="topbar">
    <a class="back" href="login.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <a class="logo-wrap" href="login.html">
      <img src="brand-logo.png" alt="CHIKE1W">
    </a>
    <a class="exit-btn" href="login.html">CHIKE1W</a>
  </header>

  <div class="stage">
    <div class="hud">
      <img class="pause" src="dice/pause.png" alt="" draggable="false">
    </div>
    <div class="board">
      <div class="roll" id="roll">50.00</div>
      <div class="target-row">
        <span>0</span>
        <b id="targetLabel">50.00</b>
        <span>100</span>
      </div>
      <input id="target" type="range" min="1" max="99" value="50" step="1">
      <div class="sides">
        <button class="side" id="overBtn" type="button">Over</button>
        <button class="side" id="underBtn" type="button">Under</button>
      </div>
      <button class="signal-btn" id="signalBtn" type="button" onclick="getSignal()">GET SIGNAL</button>
      <button class="reset-btn" type="button" onclick="resetAll()">Reset</button>
      <div class="note" id="note">Set a number, then GET SIGNAL for Over or Under.</div>
    </div>
  </div>

  <script>
    const rollEl = document.getElementById('roll');
    const target = document.getElementById('target');
    const targetLabel = document.getElementById('targetLabel');
    const overBtn = document.getElementById('overBtn');
    const underBtn = document.getElementById('underBtn');
    const signalBtn = document.getElementById('signalBtn');
    const note = document.getElementById('note');
    let busy = false;

    function fmt(n) { return n.toFixed(2); }

    function cryptoRoll() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return (buf[0] / 4294967296) * 100;
    }

    target.addEventListener('input', function () {
      targetLabel.textContent = fmt(Number(target.value));
    });

    function getSignal() {
      if (busy) return;
      busy = true;
      signalBtn.disabled = true;
      signalBtn.textContent = 'ROLLING...';
      overBtn.classList.remove('on-over');
      underBtn.classList.remove('on-under');
      rollEl.classList.remove('over', 'under');
      note.textContent = '';
      const line = Number(target.value);
      const final = cryptoRoll();
      let ticks = 0;
      const t = setInterval(function () {
        rollEl.textContent = fmt(cryptoRoll());
        ticks++;
        if (ticks >= 14) {
          clearInterval(t);
          rollEl.textContent = fmt(final);
          const isOver = final > line;
          rollEl.classList.add(isOver ? 'over' : 'under');
          overBtn.classList.toggle('on-over', isOver);
          underBtn.classList.toggle('on-under', !isOver);
          note.textContent = (isOver ? 'OVER' : 'UNDER') + ' ' + fmt(line);
          signalBtn.textContent = 'GET SIGNAL';
          signalBtn.disabled = false;
          busy = false;
        }
      }, 55);
    }

    function resetAll() {
      if (busy) return;
      target.value = 50;
      targetLabel.textContent = '50.00';
      rollEl.textContent = '50.00';
      rollEl.classList.remove('over', 'under');
      overBtn.classList.remove('on-over');
      underBtn.classList.remove('on-under');
      note.textContent = 'Set a number, then GET SIGNAL for Over or Under.';
    }
  </script>
</body>

</html>
