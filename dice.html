<!DOCTYPE html>
<html lang="en">

<head>
  <script src="js/protect.js"></script>
  <meta charset="UTF-8">
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Dice - CHIKE1W</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    html { -webkit-text-size-adjust: 100%; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: #000 url("dice/cubes.png") center / 220px repeat;
      color: #fff;
      font-family: Inter, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      min-width: 0;
    }

    .board {
      width: 100%;
      background: rgba(5, 5, 8, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px 16px 16px;
      position: relative;
    }

    .roll {
      text-align: center;
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      margin: 8px 0 22px;
    }

    .roll.over { color: #3ddc84; }
    .roll.under { color: #ff5b6e; }

    .scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #8d97ab;
      margin-bottom: 8px;
    }

    .track {
      position: relative;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff5b6e 0 50%, #3ddc84 50% 100%);
      overflow: visible;
    }

    .track-dim {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(0, 0, 0, 0.45);
    }

    .fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      border-radius: inherit;
      background: transparent;
      pointer-events: none;
    }

    .thumb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 22px;
      margin-left: -8px;
      margin-top: -11px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .mid {
      position: absolute;
      left: 50%;
      top: -5px;
      bottom: -5px;
      width: 2px;
      background: rgba(255, 255, 255, 0.7);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .side {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #141418;
      color: #6e7686;
      border-radius: 999px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .side.on-over {
      color: #04140a;
      background: #3ddc84;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .side.on-under {
      color: #fff;
      background: #ff5b6e;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .signal-btn,
    .reset-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .signal-btn {
      margin-top: 14px;
      padding: 15px;
      background: #00a84f;
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.4px;
    }

    .signal-btn:disabled {
      background: #1a1d24;
      color: #5b6478;
      cursor: not-allowed;
    }

    .reset-btn {
      margin-top: 8px;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8d97ab;
      font-size: 13px;
    }

    .note {
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
      font-size: 12px;
      color: #8d97ab;
      font-weight: 700;
    }
  </style>
</head>

<body class="theme-noise">
  <header class="topbar">
    <a class="back" href="login.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <a class="logo-wrap" href="login.html">
      <img src="brand-logo.png" alt="CHIKE1W">
    </a>
    <a class="exit-btn" href="login.html">CHIKE1W</a>
  </header>

  <div class="stage">
    <div class="board">
      <div class="roll" id="roll">50.00</div>
      <div class="scale"><span>0</span><span>50</span><span>100</span></div>
      <div class="track" id="track">
        <div class="track-dim"></div>
        <div class="mid"></div>
        <div class="fill" id="fill"></div>
        <img class="thumb" id="thumb" src="dice/thumb.png" alt="" draggable="false">
      </div>
      <div class="sides">
        <button class="side" id="overBtn" type="button">Over</button>
        <button class="side" id="underBtn" type="button">Under</button>
      </div>
      <button class="signal-btn" id="signalBtn" type="button" onclick="getSignal()">GET SIGNAL</button>
      <button class="reset-btn" type="button" onclick="resetAll()">Reset</button>
      <div class="note" id="note">GET SIGNAL moves the bar to the predicted number.</div>
    </div>
  </div>

  <script>
    const rollEl = document.getElementById('roll');
    const fill = document.getElementById('fill');
    const thumb = document.getElementById('thumb');
    const overBtn = document.getElementById('overBtn');
    const underBtn = document.getElementById('underBtn');
    const signalBtn = document.getElementById('signalBtn');
    const note = document.getElementById('note');
    let busy = false;
    let current = 50;

    function fmt(n) { return n.toFixed(2); }

    function cryptoRoll() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return (buf[0] / 4294967296) * 100;
    }

    function setBar(n) {
      current = Math.max(0, Math.min(100, n));
      const pct = current;
      fill.style.width = pct + '%';
      thumb.style.left = pct + '%';
      rollEl.textContent = fmt(current);
    }

    function getSignal() {
      if (busy) return;
      busy = true;
      signalBtn.disabled = true;
      signalBtn.textContent = 'ROLLING...';
      overBtn.classList.remove('on-over');
      underBtn.classList.remove('on-under');
      rollEl.classList.remove('over', 'under');
      note.textContent = '';
      const final = cryptoRoll();
      const t0 = performance.now();
      const dur = 1100;
      let settleFrom = null;

      function frame(now) {
        const p = Math.min(1, (now - t0) / dur);
        if (p < 0.72) {
          setBar(cryptoRoll());
          requestAnimationFrame(frame);
          return;
        }
        if (settleFrom == null) settleFrom = current;
        const e = (p - 0.72) / 0.28;
        const ease = 1 - Math.pow(1 - e, 3);
        setBar(settleFrom + (final - settleFrom) * ease);
        if (p < 1) {
          requestAnimationFrame(frame);
          return;
        }
        setBar(final);
        const isOver = final >= 50;
        rollEl.classList.add(isOver ? 'over' : 'under');
        overBtn.classList.toggle('on-over', isOver);
        underBtn.classList.toggle('on-under', !isOver);
        note.textContent = (isOver ? 'OVER' : 'UNDER') + '  ' + fmt(final);
        signalBtn.textContent = 'GET SIGNAL';
        signalBtn.disabled = false;
        busy = false;
      }
      requestAnimationFrame(frame);
    }

    function resetAll() {
      if (busy) return;
      setBar(50);
      rollEl.classList.remove('over', 'under');
      overBtn.classList.remove('on-over');
      underBtn.classList.remove('on-under');
      note.textContent = 'GET SIGNAL moves the bar to the predicted number.';
    }

    setBar(50);
  </script>
</body>

</html>
