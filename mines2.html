<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines 2 Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a1628;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .screen {
            width: 390px;
            background-color: #0a1628;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .grid-wrapper {
            background: linear-gradient(145deg, #1a2a3e, #0f1f30);
            border-radius: 24px;
            padding: 16px;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.05),
                0 8px 32px rgba(0, 0, 0, 0.6),
                0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .tile {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background-image: url('https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/6f2e9003-5bb5-47bc-b5b8-8d8fc3341b15.png');
            background-size: cover;
            background-position: center;
            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4),
                0 1px 3px rgba(0, 200, 200, 0.15);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .tile:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .control-panel {
            background: linear-gradient(160deg, #1a2a3e, #0f1f30);
            border-radius: 20px;
            padding: 22px 24px 26px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.05),
                0 6px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Segmented selector */
        .trap-selector-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trap-selector-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.03em;
        }

        .segmented-control {
            display: flex;
            background: #111d2e;
            border-radius: 14px;
            padding: 5px;
            gap: 4px;
            width: 100%;
        }

        .seg-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: rgba(255, 255, 255, 0.45);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
            user-select: none;
            letter-spacing: 0.01em;
        }

        .seg-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .seg-btn.active {
            background: #1e2f44;
            color: #ffffff;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.06);
        }

        .play-btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2f80f5 0%, #1a65d6 100%);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow:
                0 4px 16px rgba(30, 100, 220, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .play-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30, 100, 220, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .play-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(30, 100, 220, 0.35);
        }

        .exit-btn {
            margin-top: 10px;
            padding: 12px 40px;
            border-radius: 12px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .exit-btn:hover {
            border-color: #2f80f5;
            color: #fff;
            background: rgba(47, 128, 245, 0.1);
        }
    </style>
</head>

<body>

    <div id="pg-loader"
        style="position:fixed;inset:0;z-index:99999;background:url('https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/c276cbc5-9b20-4586-9597-8304e5aefb19.avif') center/cover no-repeat;">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.7);"></div>
        <div
            style="position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;">
            <div
                style="font-family:Arial,sans-serif;font-weight:900;font-size:28px;color:#fff;letter-spacing:5px;text-shadow:0 0 25px #2f80f5;">
                MINES 2</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:4px;font-family:Arial,sans-serif;">
                LOADING PREDICTOR...</div>
            <div
                style="width:72%;max-width:300px;background:rgba(255,255,255,0.15);border-radius:50px;overflow:hidden;height:7px;margin-top:4px;">
                <div id="pg-bar"
                    style="height:100%;width:1%;background:linear-gradient(90deg,#2f80f5,#1a65d6);border-radius:50px;transition:width 0.06s linear;">
                </div>
            </div>
            <div id="pg-pct"
                style="color:#fff;font-weight:900;font-size:14px;letter-spacing:3px;font-family:Arial,sans-serif;opacity:0.85;">
                1%</div>
        </div>
    </div>
    <script>(function () { var dur = 3000 + Math.random() * 2000; var p = 1, b = document.getElementById('pg-bar'), t = document.getElementById('pg-pct'), o = document.getElementById('pg-loader'); var iv = setInterval(function () { p += Math.floor(Math.random() * 4) + 1; if (p >= 100) { p = 100; clearInterval(iv); setTimeout(function () { o.style.transition = 'opacity 0.6s'; o.style.opacity = '0'; setTimeout(function () { o.remove(); }, 650); }, 200); } b.style.width = p + '%'; t.textContent = p + '%'; }, Math.round(dur / 40)); })();</script>

    <div class="screen">
        <div class="grid-wrapper">
            <div class="grid" id="grid"></div>
        </div>

        <div class="control-panel">
            <div class="trap-selector-wrap">
                <span class="trap-selector-label">Nombre de bombes</span>
                <div class="segmented-control" id="segmentedControl">
                    <button class="seg-btn" data-index="0">2</button>
                    <button class="seg-btn active" data-index="1">3</button>
                    <button class="seg-btn" data-index="2">5</button>
                    <button class="seg-btn" data-index="3">7</button>
                </div>
            </div>
            <button class="play-btn" id="playBtn">Play</button>
        </div>

        <button class="exit-btn" onclick="location.href='login.html'">EXIT</button>
    </div>

    <script>
        const TILE_IMG = 'https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/6f2e9003-5bb5-47bc-b5b8-8d8fc3341b15.png';
        const TRAP_IMG = 'https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/84e70fca-9ec4-4197-8774-d865f2d8ff57.png';

        const TRAP_OPTIONS = [2, 3, 5, 7];
        const TRAP_COUNTS = { 2: 7, 3: 5, 5: 3, 7: 2 };

        // Build grid
        const grid = document.getElementById('grid');
        const tiles = [];
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            grid.appendChild(tile);
            tiles.push(tile);
        }

        // Segmented control
        let trapIndex = 1; // default: 3
        const segBtns = document.querySelectorAll('.seg-btn');

        segBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                trapIndex = parseInt(btn.dataset.index);
                segBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                resetGrid();
            });
        });

        function resetGrid() {
            tiles.forEach(t => {
                t.style.backgroundImage = "url('" + TILE_IMG + "')";
            });
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            resetGrid();
            const trapVal = TRAP_OPTIONS[trapIndex];
            const numTraps = TRAP_COUNTS[trapVal];
            const indices = shuffle([...Array(25).keys()]).slice(0, numTraps);
            indices.forEach(i => {
                tiles[i].style.backgroundImage = "url('" + TRAP_IMG + "')";
            });
        });
    </script>
</body>

</html>
