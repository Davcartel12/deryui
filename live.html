<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Coupons - APNAJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --accent: #1e90ff;
      --bg: #07080c;
      --surface: #0d0f16;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f0f2ff;
      --muted: rgba(240, 242, 255, 0.45);
      --gold: #ffd54a;
      --green: #2dff7e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(7, 8, 12, .85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border)
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo-wrap img {
      width: 36px;
      height: 36px;
      object-fit: contain
    }

    .logo-wrap span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      color: var(--accent);
      line-height: 1
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(45, 255, 126, .1);
      border: 1px solid rgba(45, 255, 126, .3);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--green);
      text-transform: uppercase
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.2s ease-in-out infinite
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .page {
      padding: 24px 20px 120px
    }

    .page-heading {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 4px
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px
    }

    .coupon-grid {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .coupon-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      animation: fadeUp .4s ease
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .coupon-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block
    }

    .coupon-img-placeholder {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, rgba(30, 144, 255, .15), rgba(0, 212, 255, .08));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px
    }

    .coupon-body {
      padding: 18px 18px 16px
    }

    .coupon-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px
    }

    .coupon-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5
    }

    .coupon-footer {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .coupon-code-box {
      flex: 1;
      background: rgba(30, 144, 255, .08);
      border: 1px dashed rgba(30, 144, 255, .35);
      border-radius: 10px;
      padding: 10px 14px
    }

    .code-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px
    }

    .code-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--accent)
    }

    .copy-btn {
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap
    }

    .copy-btn:hover {
      background: #1a7fe0;
      transform: translateY(-1px)
    }

    .coupon-expires {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(255, 213, 74, .08);
      border: 1px solid rgba(255, 213, 74, .2);
      border-radius: 99px;
      padding: 4px 12px
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted)
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px
    }

    .empty-text {
      font-size: 14px
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 14px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--green);
      color: #000;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 9999
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      background: rgba(7, 8, 12, .92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      justify-content: center
    }

    .nav-item {
      flex: 1;
      max-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      transition: color .2s;
      padding: 4px 0
    }

    .nav-item.active {
      color: var(--accent)
    }

    .nav-item svg {
      width: 22px;
      height: 22px
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      margin-top: -2px;
      transition: opacity .2s
    }

    .nav-item.active .dot {
      opacity: 1
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="logo-wrap">
      <img src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/d53ea7a6-8eea-4316-b0f2-2583730636e0.png"
        alt="Logo">
      <span>APNAJ</span>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>Live
    </div>
  </header>

  <div class="page">
    <h1 class="page-heading">Live Coupons</h1>
    <p class="page-sub">Exclusive bonus codes — tap to copy instantly</p>
    <div class="coupon-grid" id="couponGrid">
      <div class="loading">
        <div class="spinner"></div>Loading coupons…
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✅ Copied!</div>

  <nav class="bottom-nav">
    <a href="login.html" class="nav-item"><svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg><span>Home</span>
      <div class="dot"></div>
    </a>
    <a href="live.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
      </svg><span>Live</span>
      <div class="dot"></div>
    </a>
    <a href="promo.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </svg><span>Promo</span>
      <div class="dot"></div>
    </a>
    <a href="contact.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg><span>Support</span>
      <div class="dot"></div>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5Y4KswhImaWK8k-T_bpyqmBTKnIU-aeQ",
      authDomain: "admin-8f6df.firebaseapp.com",
      projectId: "admin-8f6df",
      storageBucket: "admin-8f6df.firebasestorage.app",
      messagingSenderId: "321300416512",
      appId: "1:321300416512:web:ea5763ce2cc3462c07f0e5",
      measurementId: "G-C58C8GBYWP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const grid = document.getElementById("couponGrid");

    function copyCode(code) {
      navigator.clipboard.writeText(code).catch(() => { });
      const t = document.getElementById("toast");
      t.textContent = "✅ " + code + " copied!";
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }
    window.copyCode = copyCode;

    const q = query(collection(db, "coupons"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
      if (snap.empty) {
        grid.innerHTML = `<div class="empty"><div class="empty-icon">🎟️</div><div class="empty-text">No coupons available right now.<br>Check back soon!</div></div>`;
        return;
      }
      grid.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        const imgHtml = d.imageUrl
          ? `<img class="coupon-img" src="${d.imageUrl}" alt="${d.title}" onerror="this.style.display='none'">`
          : `<div class="coupon-img-placeholder">🎟️</div>`;
        const expiryHtml = d.expiry ? `<div class="coupon-expires">⏰ ${d.expiry}</div>` : "";
        return `
          <div class="coupon-card">
            ${imgHtml}
            <div class="coupon-body">
              <div class="coupon-title">${d.title}</div>
              <div class="coupon-desc">${d.description || ""}</div>
              <div class="coupon-footer">
                <div class="coupon-code-box">
                  <div class="code-label">Promo Code</div>
                  <div class="code-val">${d.code}</div>
                </div>
                <button class="copy-btn" onclick="copyCode('${d.code}')">Copy</button>
              </div>
              ${expiryHtml}
            </div>
          </div>`;
      }).join("");
    });
  </script>

</body>

</html>
