<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - APNAJ Coupons</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --accent: #1e90ff;
      --bg: #07080c;
      --surface: #0d0f16;
      --surface2: #13161f;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f0f2ff;
      --muted: rgba(240, 242, 255, 0.45);
      --red: #ff4f4f;
      --green: #2dff7e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(7, 8, 12, .9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--accent)
    }

    .admin-tag {
      background: rgba(255, 79, 79, .12);
      border: 1px solid rgba(255, 79, 79, .3);
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      color: var(--red);
      letter-spacing: 1px
    }

    #loginGate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 24px
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
      text-align: center
    }

    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      margin-bottom: 6px
    }

    .login-box p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px
    }

    .field {
      margin-bottom: 16px;
      text-align: left
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px
    }

    input,
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      resize: none
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent)
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted)
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: .2s;
      letter-spacing: .5px
    }

    .btn:hover {
      background: #1a7fe0;
      transform: translateY(-1px)
    }

    .btn.danger {
      background: rgba(255, 79, 79, .15);
      color: var(--red);
      border: 1px solid rgba(255, 79, 79, .3)
    }

    .btn.danger:hover {
      background: var(--red);
      color: #fff
    }

    #adminPanel {
      display: none;
      padding: 24px 20px
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 16px
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 28px
    }

    .form-card h3 {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .preview-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
      display: none;
      border: 1px solid var(--border)
    }

    .coupon-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      gap: 0;
      align-items: stretch
    }

    .ci-thumb {
      width: 80px;
      flex-shrink: 0;
      object-fit: cover
    }

    .ci-thumb-placeholder {
      width: 80px;
      flex-shrink: 0;
      background: rgba(30, 144, 255, .08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px
    }

    .ci-body {
      flex: 1;
      padding: 14px
    }

    .ci-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 2px
    }

    .ci-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--accent)
    }

    .ci-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px
    }

    .ci-actions {
      display: flex;
      align-items: center;
      padding: 0 12px
    }

    .del-btn {
      background: rgba(255, 79, 79, .1);
      border: 1px solid rgba(255, 79, 79, .25);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap
    }

    .del-btn:hover {
      background: var(--red);
      color: #fff
    }

    .empty-list {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px
    }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--green);
      color: #000;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 9999
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-wrap {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 13px
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">APNAJ</div>
    <div class="admin-tag">ADMIN</div>
  </div>

  <div id="loginGate">
    <div class="login-box">
      <h2>Admin Login</h2>
      <p>Enter password to manage coupons</p>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pwInput" placeholder="Enter admin password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn" onclick="doLogin()">Login</button>
      <div id="loginErr" style="color:var(--red);font-size:12px;margin-top:10px;display:none">Incorrect password</div>
    </div>
  </div>

  <div id="adminPanel">
    <div class="form-card">
      <h3>➕ Add New Coupon</h3>
      <div class="field"><label>Title *</label><input type="text" id="fTitle" placeholder="e.g. Weekend Bonus"></div>
      <div class="field"><label>Promo Code *</label><input type="text" id="fCode" placeholder="e.g. APNAJ50"
          style="text-transform:uppercase"></div>
      <div class="field"><label>Description</label><textarea id="fDesc" rows="2"
          placeholder="e.g. 50% deposit bonus on 1win"></textarea></div>
      <div class="field">
        <label>Image URL</label>
        <input type="url" id="fImg" placeholder="https://..." oninput="previewImg()">
        <img id="imgPreview" class="preview-img" alt="Preview">
      </div>
      <div class="field"><label>Expiry (optional)</label><input type="text" id="fExpiry"
          placeholder="e.g. Expires midnight tonight"></div>
      <button class="btn" id="addBtn" onclick="addCoupon()">Publish Coupon</button>
    </div>
    <div class="section-title">Published Coupons</div>
    <div id="couponList">
      <div class="loading-wrap">
        <div class="spinner"></div>Loading…
      </div>
    </div>
    <br>
    <button class="btn danger" onclick="doLogout()">Logout</button>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5Y4KswhImaWK8k-T_bpyqmBTKnIU-aeQ",
      authDomain: "admin-8f6df.firebaseapp.com",
      projectId: "admin-8f6df",
      storageBucket: "admin-8f6df.firebasestorage.app",
      messagingSenderId: "321300416512",
      appId: "1:321300416512:web:ea5763ce2cc3462c07f0e5",
      measurementId: "G-C58C8GBYWP"
    };

    const ADMIN_PASSWORD = "apnaj2024";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const couponCol = collection(db, "coupons");

    function doLogin() {
      const pw = document.getElementById("pwInput").value;
      if (pw === ADMIN_PASSWORD) {
        document.getElementById("loginGate").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        startListening();
      } else {
        document.getElementById("loginErr").style.display = "block";
      }
    }
    window.doLogin = doLogin;

    function doLogout() {
      document.getElementById("loginGate").style.display = "flex";
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("pwInput").value = "";
    }
    window.doLogout = doLogout;

    function previewImg() {
      const url = document.getElementById("fImg").value.trim();
      const img = document.getElementById("imgPreview");
      if (url) { img.src = url; img.style.display = "block"; }
      else { img.style.display = "none"; }
    }
    window.previewImg = previewImg;

    function toast(msg, ok = true) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = ok ? "var(--green)" : "var(--red)";
      t.style.color = ok ? "#000" : "#fff";
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    async function addCoupon() {
      const title = document.getElementById("fTitle").value.trim();
      const code = document.getElementById("fCode").value.trim().toUpperCase();
      const desc = document.getElementById("fDesc").value.trim();
      const img = document.getElementById("fImg").value.trim();
      const exp = document.getElementById("fExpiry").value.trim();
      if (!title || !code) { toast("Title and Code are required", false); return; }
      const btn = document.getElementById("addBtn");
      btn.textContent = "Publishing…"; btn.disabled = true;
      try {
        await addDoc(couponCol, { title, code, description: desc, imageUrl: img, expiry: exp, createdAt: serverTimestamp() });
        toast("✅ Coupon published!");
        ["fTitle", "fCode", "fDesc", "fImg", "fExpiry"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("imgPreview").style.display = "none";
      } catch (e) { toast("Error: " + e.message, false); }
      btn.textContent = "Publish Coupon"; btn.disabled = false;
    }
    window.addCoupon = addCoupon;

    async function deleteCoupon(id) {
      if (!confirm("Delete this coupon?")) return;
      try {
        await deleteDoc(doc(db, "coupons", id));
        toast("🗑️ Coupon deleted");
      } catch (e) { toast("Error: " + e.message, false); }
    }
    window.deleteCoupon = deleteCoupon;

    function startListening() {
      const q = query(couponCol, orderBy("createdAt", "desc"));
      onSnapshot(q, snap => {
        const list = document.getElementById("couponList");
        if (snap.empty) { list.innerHTML = `<div class="empty-list">No coupons yet. Add one above.</div>`; return; }
        list.innerHTML = snap.docs.map(d => {
          const c = d.data();
          const thumb = c.imageUrl
            ? `<img class="ci-thumb" src="${c.imageUrl}" alt="${c.title}">`
            : `<div class="ci-thumb-placeholder">🎟️</div>`;
          return `
            <div class="coupon-item">
              ${thumb}
              <div class="ci-body">
                <div class="ci-title">${c.title}</div>
                <div class="ci-code">${c.code}</div>
                <div class="ci-desc">${c.description || ""}</div>
              </div>
              <div class="ci-actions">
                <button class="del-btn" onclick="deleteCoupon('${d.id}')">🗑️</button>
              </div>
            </div>`;
        }).join("");
      });
    }
  </script>

</body>

</html>
