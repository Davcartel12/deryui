<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1038" />
  <title>Rocket Queen - CHIKE1W</title>
  <script src="js/access-core.js"></script>
  <script src="js/access-guard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2a1038;
      --panel: #3a1848;
      --line: rgba(255, 255, 255, 0.08);
      --blue: #ff9ad5;
      --mid: #e2b6ff;
      --gold: #fdd75a;
      --text: #f0f2f5;
      --muted: #9aa1b1;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    }

    .back,
    .info {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .back svg,
    .info svg {
      width: 18px;
      height: 18px;
    }

    .title {
      flex: 1;
      text-align: center;
    }

    .title img {
      height: 22px;
      width: auto;
      display: inline-block;
      vertical-align: middle;
    }

    .history-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px 10px;
    }

    .history {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: -6px;
      scrollbar-width: none;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex: 0 0 auto;
      min-width: 52px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: rgba(129, 135, 148, 0.12);
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill.mid {
      color: var(--mid);
    }

    .pill.high {
      color: var(--gold);
    }

    .pill.empty {
      color: var(--muted);
      cursor: default;
    }

    .clock {
      flex: 0 0 34px;
      width: 34px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: rgba(129, 135, 148, 0.12);
      color: #ffd27a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clock svg {
      width: 16px;
      height: 16px;
    }

    .stage {
      position: relative;
      margin: 0 12px 12px;
      aspect-ratio: 2 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: #7b3dff;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .mult {
      position: absolute;
      left: 7%;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      text-align: left;
    }

    .hud[data-phase="flying"] .mult,
    .hud[data-phase="crashed"] .mult,
    .hud[data-phase="idle"] .mult {
      display: block;
    }

    .hud[data-phase="crashed"] .mult {
      left: 0;
      right: 0;
      text-align: center;
    }

    .mult-value {
      font-size: clamp(44px, 14vw, 58px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
      color: #fff;
      text-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .mult-value small {
      font-size: 0.62em;
      font-weight: 800;
    }

    .mult-label {
      display: none;
      margin-top: 6px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #fff;
    }

    .hud[data-phase="crashed"] .mult-label,
    .hud[data-phase="idle"] .mult-label {
      display: block;
    }

    .hud[data-phase="idle"] .mult-label {
      font-size: 13px;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
    }

    .bets {
      display: grid;
      gap: 10px;
      padding: 12px 12px 0;
    }

    .bet {
      background: #1d1e20;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 10px 12px 12px;
    }

    .place {
      position: relative;
      display: block;
      width: 100%;
      height: 76px;
      padding: 0 12px 8px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8a00 0%, #ffa41b 55%, #ffc24a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(255, 164, 27, 0.38);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      overflow: hidden;
    }

    .place::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 4px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.55);
    }

    .place-label {
      display: block;
      transition: font-size 0.2s, opacity 0.2s;
    }

    .place-value {
      display: none;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .place-value small {
      font-size: 0.6em;
    }

    .place.has-value .place-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.85;
      margin-bottom: 3px;
    }

    .place.has-value .place-value {
      display: block;
    }

    .place.hit {
      background: linear-gradient(135deg, #0f9d58 0%, #22c55e 60%, #5ee39a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .place.miss {
      background: linear-gradient(135deg, #b42318 0%, #e0442f 60%, #ff7a66 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(224, 68, 47, 0.35);
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(5, 8, 18, 0.62);
      display: none;
      align-items: flex-end;
    }

    .sheet.show {
      display: flex;
    }

    .sheet-card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #1d1e20;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
    }

    .sheet-card h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .sheet-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .sheet-card button {
      margin-top: 14px;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: #e25cff;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <a class="back" href="login.html" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="title"><img src="rocketqueen/logo.png" alt="Rocket Queen"></div>
      <button class="info" type="button" id="infoBtn" aria-label="About this screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      </button>
    </header>

    <div class="history-wrap">
      <div class="history" id="historyBar">
        <button class="pill empty" type="button">--</button>
      </div>
      <button class="clock" type="button" id="clockBtn" aria-label="Full history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </div>

    <section class="stage" id="stage">
      <canvas id="sky"></canvas>
      <div class="hud" id="hud" data-phase="loading">
        <div class="mult">
          <div class="mult-value" id="liveMult"><small>x</small>--</div>
          <div class="mult-label" id="multLabel">Flew away</div>
        </div>
      </div>
    </section>

    <div class="bets">
      <article class="bet">
        <button type="button" class="place" data-mode="assurance" data-min="1.10" data-max="1.99">
          <span class="place-label">ASSURANCE</span>
          <strong class="place-value"></strong>
        </button>
      </article>
      <article class="bet">
        <button type="button" class="place" data-mode="coefficient" data-min="2.00" data-max="4.00">
          <span class="place-label">COEFFICIENT</span>
          <strong class="place-value"></strong>
        </button>
      </article>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <h2>Rocket Queen</h2>
      <p>The flight on this screen follows the live Rocket Queen round. The strip above it shows rounds that already finished. Assurance and coefficient are local picks for the round in progress. They do not tell you where it will stop.</p>
      <button type="button" id="sheetClose">Close</button>
    </div>
  </div>

  <script>
    window.Flight = (function () {
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const multEl = document.getElementById("liveMult");
      const labelEl = document.getElementById("multLabel");
      const hudEl = document.getElementById("hud");
      const WAIT_MS = 5000;
      const queen = new Image();
      queen.src = "rocketqueen/queen.webp";
      const sparks = [
        { x: 0.08, y: 0.16, s: 5 },
        { x: 0.22, y: 0.34, s: 3 },
        { x: 0.78, y: 0.18, s: 4 },
        { x: 0.9, y: 0.62, s: 3.5 },
        { x: 0.7, y: 0.78, s: 4 }
      ];

      let W = 0;
      let H = 0;
      let dpr = 1;
      let lastText = "";
      let lastLabel = "";
      let lastPhase = "";
      const sim = {
        state: "loading",
        id: null,
        coef: 1,
        server: 1,
        sampleAt: 0,
        k: 0.09,
        flightStart: 0,
        stop: null,
        crashedAt: 0,
        waitingSince: 0,
        waitEndsAt: 0,
        waitTotal: WAIT_MS
      };

      function resize() {
        const rect = stage.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(1, Math.round(rect.width));
        H = Math.max(1, Math.round(rect.height));
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function setPhase(phase, text, label) {
        if (phase !== lastPhase) { hudEl.dataset.phase = phase; lastPhase = phase; }
        if (text != null && text !== lastText) { multEl.innerHTML = "<small>x</small>" + text; lastText = text; }
        if (label != null && label !== lastLabel) { labelEl.textContent = label; lastLabel = label; }
      }

      // Same curve Lucky Jet uses: the trail starts at the lower left and the rider sits on its tip.
      function pathPoint(p) {
        const ax = 0.05 * W, ay = 0.92 * H;
        const cx = 0.46 * W, cy = 0.92 * H;
        const bx = 0.64 * W, by = 0.72 * H;
        const q = 1 - p;
        return {
          x: q * q * ax + 2 * q * p * cx + p * p * bx,
          y: q * q * ay + 2 * q * p * cy + p * p * by
        };
      }

      function drawCurve(p) {
        if (p <= 0) return;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(255,255,255,0.92)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        const steps = 40;
        for (let i = 0; i <= steps; i++) {
          const pt = pathPoint(p * i / steps);
          if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // (x, y) is the tip of the flame. Measured on the sprite: the flame ends at 13% across and 91% down.
      function drawQueen(x, y, now) {
        if (!queen.complete || !queen.naturalWidth) return;
        const h = H * 0.58;
        const w = h * queen.naturalWidth / queen.naturalHeight;
        const bob = Math.sin(now / 320) * 2;
        const tipX = (0.13 - 0.5) * w;
        const tipY = (0.91 - 0.5) * h;
        ctx.drawImage(queen, x - tipX - w / 2, y - tipY - h / 2 + bob, w, h);
      }

      function spark(x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r * 0.28, y - r * 0.28);
        ctx.lineTo(x + r, y);
        ctx.lineTo(x + r * 0.28, y + r * 0.28);
        ctx.lineTo(x, y + r);
        ctx.lineTo(x - r * 0.28, y + r * 0.28);
        ctx.lineTo(x - r, y);
        ctx.lineTo(x - r * 0.28, y - r * 0.28);
        ctx.closePath();
        ctx.fill();
      }

      function paintSky(coef) {
        const g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, "#7b3dff");
        g.addColorStop(0.42, "#e24bdc");
        g.addColorStop(0.72, "#ff7a3a");
        g.addColorStop(1, "#ff9a1a");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#ffb03a";
        ctx.beginPath();
        ctx.moveTo(W * 0.42, H);
        ctx.quadraticCurveTo(W * 0.68, H * 0.78, W, H * 0.86);
        ctx.lineTo(W, H);
        ctx.fill();
        ctx.fillStyle = "#ff8a18";
        ctx.beginPath();
        ctx.moveTo(W * 0.58, H);
        ctx.quadraticCurveTo(W * 0.8, H * 0.88, W, H * 0.93);
        ctx.lineTo(W, H);
        ctx.fill();

        ctx.fillStyle = "#ffe56a";
        sparks.forEach(function (star) {
          spark(star.x * W, star.y * H, star.s);
        });
      }

      function frame(now) {
        if (!W) resize();
        if (sim.state === "flying") {
          const since = (now - sim.sampleAt) / 1000;
          const target = sim.server * Math.exp(sim.k * Math.min(since, 2.5));
          sim.coef += (target - sim.coef) * 0.18;
          const t = (now - sim.flightStart) / 1000;
          const p = 1 - Math.exp(-t / 1.9);
          const pt = pathPoint(p);
          paintSky(sim.coef);
          drawCurve(p);
          drawQueen(pt.x, pt.y, now);
          setPhase("flying", sim.coef.toFixed(2), "");
        } else if (sim.state === "crashed") {
          const dt = (now - sim.crashedAt) / 1000;
          const pt = pathPoint(1);
          paintSky(sim.stop || 1);
          drawCurve(1);
          if (dt < 0.9) {
            const k = dt / 0.9;
            drawQueen(pt.x + k * k * W * 0.9, pt.y - k * k * H * 1.1, now);
          }
          setPhase("crashed", (sim.stop || 0).toFixed(2), "Flew away");
        } else if (sim.state === "waiting") {
          paintSky(1);
          setPhase("waiting", null, "");
        } else {
          paintSky(1);
          setPhase(sim.state === "loading" ? "loading" : "idle", "--", "Feed unavailable");
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", function () { W = 0; });
      requestAnimationFrame(frame);

      return {
        update: function (snapshot) {
          const now = performance.now();
          const newRound = snapshot.id != null && snapshot.id !== sim.id;
          if (newRound) sim.id = snapshot.id;

          if (snapshot.stop != null) {
            if (sim.state !== "crashed" || newRound) {
              sim.state = "crashed";
              sim.crashedAt = now;
              sim.stop = Number(snapshot.stop);
              sim.coef = sim.stop;
            }
            return;
          }

          if (snapshot.coef != null) {
            const value = Number(snapshot.coef);
            if (sim.state !== "flying" || newRound) {
              sim.state = "flying";
              sim.coef = value;
              sim.server = value;
              sim.sampleAt = now;
              sim.flightStart = now - (Math.log(Math.max(value, 1.001)) / sim.k) * 1000;
              sim.stop = null;
              return;
            }
            const dt = (now - sim.sampleAt) / 1000;
            if (dt > 0.3 && value > sim.server) {
              const observed = Math.log(value / sim.server) / dt;
              if (isFinite(observed) && observed > 0.01 && observed < 0.6) sim.k = sim.k * 0.7 + observed * 0.3;
            }
            sim.server = value;
            sim.sampleAt = now;
            if (sim.coef > value * 1.02) sim.coef = value;
            return;
          }

          if (sim.state !== "waiting") {
            sim.state = "waiting";
            sim.waitingSince = now;
            sim.waitEndsAt = now + WAIT_MS;
            sim.waitTotal = WAIT_MS;
          }
          if (snapshot.phase === "betting" && snapshot.nextAt && snapshot.changedAt && snapshot.serverNow) {
            sim.waitTotal = Math.max(1000, snapshot.nextAt - snapshot.changedAt);
            sim.waitEndsAt = now + Math.max(0, snapshot.nextAt - snapshot.serverNow);
          } else if (snapshot.phase === "waiting") {
            sim.waitEndsAt = Math.min(sim.waitEndsAt, now);
          }
        },
        idle: function () {
          if (sim.state === "flying" || sim.state === "crashed") return;
          sim.state = "idle";
        }
      };
    })();
  </script>
  <script src="js/crash-engine.js"></script>
  <script>
    (function () {
      const GATEWAY = "https://crash-gateway-grm-cr.gamedev-tech.cc";
      const HISTORY_URL = GATEWAY + "/history";
      const STATE_URL = GATEWAY + "/state";
      const SESSION_ID = "6e54a31882064d171bf4328877d40654dc076e7819375636c307d31539977b212dbcfbf18785833e14cffdac4b444c51e83893eb1d5b3fd036acdd410e49289b8a345572c5df048f91c1cd763a35ed7840f5679e6495e961c0cc19e8acb24fbd0a905c77c82fcf54026429db2132faeda5310fcaef9e626bc7c32c5eee3b32c4bcc532f9b4bfbecc6a02fc4bef99f4703b9db903d233c307a8a6351b7bfad0e56fd344c97923888438e9b5be.2f24e63dbccdd635f6b3a171d3113cb7.077dee8d-c923-4c02-9bee-757573662e69";
      const CUSTOMER_ID = "077dee8d-c923-4c02-9bee-757573662e69";
      const historyBar = document.getElementById("historyBar");
      let rounds = [];
      let lastSeenId = null;

      function band(coef) {
        if (coef >= 10) return "high";
        if (coef >= 2) return "mid";
        return "";
      }

      function money(coef) {
        return Number(coef).toFixed(2) + "x";
      }

      function parseRounds(data) {
        if (window.CrashEngine && CrashEngine.normalizeHistoryResponse) {
          const norm = CrashEngine.normalizeHistoryResponse(data);
          if (norm && norm.status === "ok" && norm.rounds && norm.rounds.length) {
            return norm.rounds.map(function (round) {
              return { id: round.id, coef: Number(round.coef) };
            }).filter(function (round) { return isFinite(round.coef) && round.coef > 0; });
          }
        }
        const raw = Array.isArray(data) ? data : (data && (data.rounds || data.history || data.items || data.data)) || [];
        if (!Array.isArray(raw)) return [];
        return raw.map(function (item, index) {
          let coef;
          if (typeof item === "number") {
            coef = item;
          } else {
            const first = Array.isArray(item.finalValues) ? item.finalValues[0] : undefined;
            coef = Number(item.topCoefficient ?? first ?? item.coef ?? item.coefficient ?? item.multiplier ?? item.crash);
          }
          return { id: item && item.id != null ? item.id : index, coef: coef };
        }).filter(function (round) { return isFinite(round.coef) && round.coef > 0; });
      }

      const FADE = [1, 1, 0.62, 0.4, 0.3];
      function renderHistory() {
        historyBar.innerHTML = "";
        if (!rounds.length) {
          const empty = document.createElement("button");
          empty.className = "pill empty";
          empty.type = "button";
          empty.textContent = "--";
          historyBar.appendChild(empty);
          return;
        }
        rounds.slice(0, 24).forEach(function (round, index) {
          const pill = document.createElement("button");
          pill.type = "button";
          pill.className = "pill " + band(round.coef);
          pill.textContent = money(round.coef);
          pill.style.opacity = FADE[Math.min(index, FADE.length - 1)];
          historyBar.appendChild(pill);
        });
      }

      async function fetchHistory() {
        try {
          const res = await fetch(HISTORY_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          const data = await res.json();
          const next = parseRounds(data);
          if (!next.length) return;
          if (!rounds.length) {
            rounds = next.slice(0, 500);
            lastSeenId = rounds[0] && rounds[0].id;
            renderHistory();
            return;
          }
          if (next[0] && next[0].id != null && next[0].id === lastSeenId) return;
          const seen = {};
          rounds.forEach(function (round) { if (round.id != null) seen[round.id] = true; });
          const fresh = next.filter(function (round) { return round.id == null || !seen[round.id]; });
          rounds = fresh.concat(rounds).slice(0, 500);
          lastSeenId = rounds[0] && rounds[0].id;
          renderHistory();
        } catch (error) { /* strip keeps its last contents */ }
      }

      let stateFailures = 0;
      let lastStopId = null;
      async function fetchState() {
        try {
          const res = await fetch(STATE_URL, {
            headers: { accept: "application/json", "session-id": SESSION_ID, "customer-id": CUSTOMER_ID }
          });
          if (!res.ok) throw new Error("state " + res.status);
          const data = await res.json();
          const current = Array.isArray(data.currentCoefficients) ? data.currentCoefficients[0] : null;
          const stop = Array.isArray(data.stopCoefficients) ? data.stopCoefficients[0] : null;
          const id = data.roundConfig && data.roundConfig.id != null ? data.roundConfig.id : null;
          const ms = function (value) { const t = Date.parse(value); return isFinite(t) ? t : null; };
          stateFailures = 0;
          Flight.update({
            id: id, coef: current, stop: stop,
            phase: data.currentState || null,
            changedAt: ms(data.stateChangedAt),
            nextAt: ms(data.nextStateTime),
            serverNow: ms(data.currentTime)
          });
          Predict.sync({ id: id, stop: stop });

          if (stop != null && id != null && id !== lastStopId) {
            lastStopId = id;
            const known = rounds.some(function (round) { return round.id === id; });
            if (!known) {
              rounds = [{ id: id, coef: Number(stop) }].concat(rounds).slice(0, 500);
              lastSeenId = id;
              renderHistory();
            }
          }
        } catch (error) {
          stateFailures++;
          if (stateFailures >= 4) Flight.idle();
        }
      }

      const Predict = (function () {
        const buttons = Array.prototype.slice.call(document.querySelectorAll(".place"));
        const picks = {};
        let roundId = null;
        let roundSettled = false;

        function fmt(value) { return "<small>x</small>" + value.toFixed(2); }

        function draw(min, max) {
          const t = Math.pow(Math.random(), 1.6);
          return Math.round((min + (max - min) * t) * 100) / 100;
        }

        function render(button) {
          const pick = picks[button.dataset.mode];
          const valueEl = button.querySelector(".place-value");
          button.classList.remove("has-value", "hit", "miss");
          if (!pick) {
            valueEl.innerHTML = "";
            return;
          }
          button.classList.add("has-value");
          valueEl.innerHTML = fmt(pick.value);
          if (pick.outcome) button.classList.add(pick.outcome);
        }

        function pickFor(button) {
          picks[button.dataset.mode] = {
            roundId: roundId,
            value: draw(Number(button.dataset.min), Number(button.dataset.max)),
            outcome: null
          };
          render(button);
        }

        buttons.forEach(function (button) {
          button.addEventListener("click", function () {
            const pick = picks[button.dataset.mode];
            if (pick && pick.roundId === roundId) return;
            if (roundSettled) return;
            pickFor(button);
          });
        });

        return {
          sync: function (snapshot) {
            if (snapshot.id != null && snapshot.id !== roundId) {
              roundId = snapshot.id;
              roundSettled = snapshot.stop != null;
              Object.keys(picks).forEach(function (mode) { delete picks[mode]; });
              buttons.forEach(function (button) {
                if (roundSettled) render(button); else pickFor(button);
              });
            }
            if (snapshot.stop != null && !roundSettled) {
              roundSettled = true;
              const stop = Number(snapshot.stop);
              buttons.forEach(function (button) {
                const pick = picks[button.dataset.mode];
                if (pick && pick.roundId === roundId && !pick.outcome) {
                  pick.outcome = stop >= pick.value ? "hit" : "miss";
                  render(button);
                }
              });
            }
          }
        };
      })();

      const sheet = document.getElementById("sheet");
      document.getElementById("infoBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("clockBtn").addEventListener("click", function () {
        sheet.classList.add("show");
      });
      document.getElementById("sheetClose").addEventListener("click", function () {
        sheet.classList.remove("show");
      });
      sheet.addEventListener("click", function (event) {
        if (event.target === sheet) sheet.classList.remove("show");
      });

      fetchHistory();
      setInterval(fetchHistory, 5000);
      fetchState();
      setInterval(fetchState, 600);
    })();
  </script>
</body>

</html>
