    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html { -webkit-text-size-adjust: 100%; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: Inter, 'DM Sans', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #07080c;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .stage-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .game {
            position: relative;
            z-index: 1;
            width: min(78%, 340px);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .cups {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            width: 100%;
            margin: 0;
            position: relative;
            overflow: visible;
        }

        .cup {
            flex: 1;
            min-width: 0;
            position: relative;
            transition: 0.6s;
        }

        .cup img.cup-img {
            width: 100%;
            height: auto;
            z-index: 2;
            position: relative;
            display: block;
            pointer-events: none;
        }

        .hidden-item {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            max-width: 40px;
            opacity: 0;
            transition: 0.5s;
            z-index: 1;
            pointer-events: none;
        }

        .show .hidden-item { opacity: 1; }

        .lift { transform: translateY(-22%); }

        .lift .hidden-item {
            transform: translateX(-50%) translateY(70%);
        }

        .buttons {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 92%;
        }

        .mode-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            flex: 1;
            min-width: 0;
        }

        .mode-btn img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .mode-btn:active { transform: scale(0.95); }

        .mode-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .game .exit-btn { display: none !important; }

        @media (max-height: 560px) {
            .cups { margin-top: 0; }
            .buttons { margin-top: 10px; }
            .lift { transform: translateY(-16%); }
        }
    </style>

    <div class="screen">
    <img class="stage-bg" src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/ecae2b74-9e36-47a0-b79d-521aaaaa5e0e.png" alt="" draggable="false">
    <div class="game">
        <div class="cups" id="cups">
            <div class="cup">
                <img class="cup-img"
                    src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/ea1155da-f94a-476e-9c40-bf3d29e6af84.png">
                <img class="hidden-item" src="">

            <div class="cup">
                <img class="cup-img"
                    src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/ea1155da-f94a-476e-9c40-bf3d29e6af84.png">
                <img class="hidden-item" src="">
            </div>
            <div class="cup">
                <img class="cup-img"
                    src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/ea1155da-f94a-476e-9c40-bf3d29e6af84.png">
                <img class="hidden-item" src="">
            </div>

        <div class="buttons">
            <button class="mode-btn" id="btn1" onclick="startGame('two')">
                <img
                    src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/524d56dc-d098-44c7-8ead-f01639eb2702.png">
            </button>
            <button class="mode-btn" id="btn2" onclick="startGame('one')">
                <img
                    src="https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/297f9a6f-e447-45b1-b34b-70d42a4a130a.png">
            </button>
        </div>
        <button class="exit-btn" onclick="location.href='login.html'">EXIT</button>
    </div>
    </div>

<script>
        const BALL_SRC = "https://i.supaimg.com/4f891786-3561-4996-9953-16a96d033ae3/c012728f-b770-46ff-a811-cf55f1220c99.png";
        function cryptoInt(a, b) {
            const buf = new Uint32Array(1);
            crypto.getRandomValues(buf);
            return a + (buf[0] % (b - a));
        }
        const container = document.getElementById("cups");
        const btn1 = document.getElementById("btn1");
        const btn2 = document.getElementById("btn2");

        function setButtonsDisabled(val) {
            btn1.disabled = val;
            btn2.disabled = val;
        }

        function getCups() {
            return Array.from(container.querySelectorAll(".cup"));
        }

        function resetCups() {
            getCups().forEach(c => {
                c.classList.remove("show", "lift");
                c.style.transform = "";
                c.style.transition = "0.6s";
                c.querySelector(".hidden-item").src = "";
            });
        }

        function swapCups(a, b) {
            const rectA = a.getBoundingClientRect();
            const rectB = b.getBoundingClientRect();
            const dx = rectB.left - rectA.left;

            a.style.transition = "transform 0.3s ease";
            b.style.transition = "transform 0.3s ease";
            a.style.transform = `translateX(${dx}px)`;
            b.style.transform = `translateX(${-dx}px)`;

            return new Promise(resolve => {
                setTimeout(() => {
                    a.style.transition = "none";
                    b.style.transition = "none";
                    a.style.transform = "";
                    b.style.transform = "";

                    const parent = a.parentNode;
                    const aNext = a.nextSibling;
                    if (aNext === b) {
                        parent.insertBefore(b, a);
                    } else {
                        parent.insertBefore(a, b);
                        parent.insertBefore(b, aNext);
                    }
                    resolve();
                }, 320);
            });
        }

        async function runShuffles(count) {
            for (let i = 0; i < count; i++) {
                const cups = getCups();
                const ai = cryptoInt(0, 3);
                let bi;
                do { bi = cryptoInt(0, 3); } while (bi === ai);
                await swapCups(cups[ai], cups[bi]);
                await new Promise(r => setTimeout(r, 80));
            }
        }

        async function startGame(mode) {
            setButtonsDisabled(true);
            resetCups();

            const cups = getCups();
            let ballCupIndices;
            if (mode === 'two') {
                // Two-ball mode: still uniform over cup choices; show odds 2/3 for picking a ball cup
                const emptyIndex = cryptoInt(0, 3);
                ballCupIndices = [0, 1, 2].filter(i => i !== emptyIndex);
            } else {
                ballCupIndices = [cryptoInt(0, 3)];
            }

            const ballCupEls = ballCupIndices.map(i => {
                cups[i].querySelector(".hidden-item").src = BALL_SRC;
                return cups[i];
            });

            await runShuffles(14);
            await new Promise(r => setTimeout(r, 500));

            ballCupEls.forEach(c => {
                c.style.transition = "0.6s";
                c.classList.add("lift", "show");
            });

            await new Promise(r => setTimeout(r, 2200));
            ballCupEls.forEach(c => c.classList.remove("lift", "show"));
            setButtonsDisabled(false);
        }
    </script>
